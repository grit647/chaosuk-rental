<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เช่าสุข — เข้าสู่ระบบ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'IBM Plex Sans Thai', sans-serif;
    background: #F7F1E6; color: #241812;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .wrap { width: 100%; max-width: 380px; }
  .logo-row { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 6px; }
  .logo-badge { width: 38px; height: 38px; border-radius: 10px; background: #C1622D; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 17px; }
  .logo-text { font-size: 20px; font-weight: 700; }
  .tagline { text-align: center; font-size: 12.5px; color: #9C8B78; margin-bottom: 28px; }
  .card { background: #FFFFFF; border-radius: 14px; padding: 28px 26px; box-shadow: 0 8px 28px rgba(36,24,18,0.08); }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 11.5px; font-weight: 600; color: #7C6E5F; margin-bottom: 5px; }
  .field input { width: 100%; padding: 10px 12px; border-radius: 7px; border: 1px solid #E3D8C8; font-size: 13px; font-family: inherit; }
  .field input:focus { outline: none; border-color: #C1622D; }
  .submit-btn { width: 100%; padding: 12px; border-radius: 8px; border: none; background: #C1622D; color: #fff; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; }
  .submit-btn:disabled { opacity: 0.6; cursor: default; }
  .err { font-size: 12px; color: #B24336; margin-top: 12px; text-align: center; display: none; }
  .signup-link { text-align: center; margin-top: 16px; font-size: 12px; color: #7C6E5F; }
  .signup-link a { color: #C1622D; font-weight: 600; text-decoration: none; }
  .signup-link a:hover { text-decoration: underline; }
  .footer-note { text-align: center; font-size: 10.5px; color: #B0A08C; margin-top: 18px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo-row"><div class="logo-badge">ช</div><div class="logo-text">เช่าสุข</div></div>
    <div class="tagline">เข้าสู่ระบบ</div>
    <div class="card">
      <div class="field">
        <label>เบอร์โทรศัพท์</label>
        <input type="tel" id="phone" placeholder="08X-XXX-XXXX" autocomplete="tel">
      </div>
      <div class="field">
        <label>รหัสผ่าน</label>
        <input type="password" id="pin" placeholder="รหัสผ่าน" autocomplete="current-password">
        <!-- Per explicit user request ("claim your account" flow): a
             brand-new building's row can exist with NO pin yet, waiting
             for the real customer's first login — this hint tells them
             they can just type whatever password they want to set it. -->
        <div style="font-size:10.5px;color:#9C8B78;margin-top:5px">เข้าครั้งแรก? พิมพ์รหัสผ่านที่ต้องการตั้งได้เลย ระบบจะบันทึกให้อัตโนมัติ</div>
      </div>
      <button class="submit-btn" id="submitBtn" onclick="doLogin()">เข้าสู่ระบบ</button>
      <div class="err" id="err"></div>
      <!-- Per explicit user request: a first-time visitor (no account yet)
           needs somewhere to go besides a failed login attempt — real
           self-service signup isn't built yet, so this points to a plain
           "contact us, coming soon" placeholder instead of a broken flow. -->
      <div class="signup-link">ยังไม่มีบัญชี? <a href="/contact-us">สร้างตึกใหม่ / ใช้งานครั้งแรก</a></div>
      <div class="signup-link">ผู้ดูแล? <a href="/staff-login">เข้าสู่ระบบที่นี่</a></div>
      <div class="signup-link">เป็นผู้เช่า? <a href="/tenant-login">เข้าสู่ระบบที่นี่</a></div>
    </div>
    <div class="footer-note">เช่าสุข — ระบบจัดการหอพัก/อพาร์ทเมนท์</div>
  </div>

<script>
  async function doLogin() {
    const phone = document.getElementById('phone').value.trim();
    const pin = document.getElementById('pin').value.trim();
    const err = document.getElementById('err');
    const btn = document.getElementById('submitBtn');
    err.style.display = 'none';
    if (!phone || !pin) {
      err.textContent = 'กรุณากรอกเบอร์โทรและรหัสผ่าน';
      err.style.display = 'block';
      return;
    }
    btn.disabled = true;
    btn.textContent = 'กำลังเข้าสู่ระบบ...';
    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone, pin }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'เข้าสู่ระบบไม่สำเร็จ');
      if (data.role === 'owner') {
        // Per explicit user request: land on a "your buildings" picker
        // first instead of jumping straight into the dashboard — makes
        // room for an owner who manages more than one building later,
        // and gives a clear "+ เพิ่มตึกใหม่" entry point from day one.
        window.location.href = '/my-buildings';
      } else {
        // Tenant/staff/admin portals aren't built yet — per explicit user
        // request, เจ้าของ (owner) came first. Show a simple confirmation
        // instead of a broken redirect for the other roles for now.
        document.body.innerHTML = '<div style="text-align:center;font-family:inherit;padding:60px 20px">' +
          '<div style="font-size:20px;font-weight:700;margin-bottom:8px">เข้าสู่ระบบสำเร็จครับ 🎉</div>' +
          '<div style="font-size:14px;color:#7C6E5F">บทบาท: ' + data.role + '</div>' +
          '<div style="font-size:12.5px;color:#9C8B78;margin-top:16px">หน้าสำหรับบทบาทนี้ยังอยู่ระหว่างสร้างครับ</div>' +
          '</div>';
      }
    } catch (e) {
      err.textContent = e.message;
      err.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'เข้าสู่ระบบ';
    }
  }
  document.getElementById('pin').addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });
</script>
</body>
</html>
