  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

lex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;cursor:pointer;background:{{ navBilling.bg }}\">\n              <div style=\"width:6px;height:6px;border-radius:1px;flex-shrink:0;background:{{ navBilling.dot }}\"><\u002Fdiv>\n              <span style=\"font-size:13.5px;color:{{ navBilling.color }};font-weight:{{ navBilling.weight }}\">บิล &amp; ใบแจ้งหนี้<\u002Fspan>\n            <\u002Fdiv>\n            <div onclick=\"{{ goMaintenance }}\" style=\"display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;cursor:pointer;background:{{ navMaint.bg }}\">\n              <div style=\"width:6px;height:6px;border-radius:1px;flex-shrink:0;background:{{ navMaint.dot }}\"><\u002Fdiv>\n              <span style=\"font-size:13.5px;color:{{ navMaint.color }};font-weight:{{ navMaint.weight }}\">แจ้งซ่อม<\u002Fspan>\n              <sc-if value=\"{{ hasOpenMaint }}\" hint-placeholder-val=\"{{ false }}\">\n                <span style=\"margin-left:auto;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#B24336;color:#fff;font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace\">{{ openMaintCount }}<\u002Fspan>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <div onclick=\"{{ goWaterReport }}\" style=\"display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;cursor:pointer;background:{{ navWater.bg }}\">\n              <div style=\"width:6px;height:6px;border-radius:1px;flex-shrink:0;background:{{ navWater.dot }}\"><\u002Fdiv>\n              <span style=\"font-size:13.5px;color:{{ navWater.color }};font-weight:{{ navWater.weight }}\">การใช้น้ำประปา<\u002Fspan>\n            <\u002Fdiv>\n            <div onclick=\"{{ goElecReport }}\" style=\"display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;cursor:pointer;background:{{ navElec.bg }}\">\n              <div style=\"width:6px;height:6px;border-radius:1px;flex-shrink:0;background:{{ navElec.dot }}\"><\u002Fdiv>\n              <span style=\"font-size:13.5px;color:{{ navElec.color }};font-weight:{{ navElec.weight }}\">การใช้ไฟฟ้า<\u002Fspan>\n            <\u002Fdiv>\n            <div onclick=\"{{ goEquipment }}\" style=\"display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;cursor:pointer;background:{{ navEquip.bg }}\">\n              <div style=\"width:6px;height:6px;border-radius:1px;flex-shrink:0;background:{{ navEquip.dot }}\"><\u002Fdiv>\n              <span style=\"font-size:13.5px;color:{{ navEquip.color }};font-weight:{{ navEquip.weight }}\">Set อุปกรณ์<\u002Fspan>\n            <\u002Fdiv>\n            <div onclick=\"{{ goExpenses }}\" style=\"display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;cursor:pointer;background:{{ navExpense.bg }}\">\n              <div style=\"width:6px;height:6px;border-radius:1px;flex-shrink:0;background:{{ navExpense.dot }}\"><\u002Fdiv>\n              <span style=\"font-size:13.5px;color:{{ navExpense.color }};font-weight:{{ navExpense.weight }}\">บัญชีรายจ่าย<\u002Fspan>\n            <\u002Fdiv>\n            <div onclick=\"{{ goContracts }}\" style=\"display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;cursor:pointer;background:{{ navContract.bg }}\">\n              <div style=\"width:6px;height:6px;border-radius:1px;flex-shrink:0;background:{{ navContract.dot }}\"><\u002Fdiv>\n              <span style=\"font-size:13.5px;color:{{ navContract.color }};font-weight:{{ navContract.weight }}\">สัญญาเช่า<\u002Fspan>\n            <\u002Fdiv>\n            <div onclick=\"{{ goCalendar }}\" style=\"display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;cursor:pointer;background:{{ navCalendar.bg }}\">\n              <div style=\"width:6px;height:6px;border-radius:1px;flex-shrink:0;background:{{ navCalendar.dot }}\"><\u002Fdiv>\n              <span style=\"font-size:13.5px;color:{{ navCalendar.color }};font-weight:{{ navCalendar.weight }}\">ปฏิทิน<\u002Fspan>\n            <\u002Fdiv>\n            <div onclick=\"{{ goSettings }}\" style=\"display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;cursor:pointer;background:{{ navSettings.bg }}\">\n              <div style=\"width:6px;height:6px;border-radius:1px;flex-shrink:0;background:{{ navSettings.dot }}\"><\u002Fdiv>\n              <span style=\"font-size:13.5px;color:{{ navSettings.color }};font-weight:{{ navSettings.weight }}\">ตั้งค่า<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"margin-top:auto;padding-top:14px;display:flex;flex-direction:column;gap:10px\">\n            <div style=\"display:flex;align-items:center;gap:10px;padding:11px;border-radius:8px;background:rgba(241,235,224,0.08)\">\n              <div style=\"width:32px;height:32px;border-radius:50%;background:rgba(241,235,224,0.25);flex-shrink:0\"><\u002Fdiv>\n              <div>\n                <div style=\"font-size:12.5px;font-weight:600;color:#F1EBE0\">คุณอารีย์ ผู้ดูแล<\u002Fdiv>\n                <div style=\"font-size:11px;color:rgba(241,235,224,0.55)\">เจ้าของหอพัก<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div onclick=\"{{ logout }}\" style=\"display:flex;align-items:center;justify-content:center;gap:8px;padding:11px;border-radius:8px;border:1px solid rgba(241,235,224,0.18);color:#E8B4A0;font-size:12.5px;font-weight:600;cursor:pointer\">\n              <span style=\"font-size:14px\">⏻<\u002Fspan> ออกจากระบบ\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"flex:1;padding:0 32px 28px;box-sizing:border-box;overflow:auto\">\n\n          <sc-if value=\"{{ showMobileMenuBtn }}\" hint-placeholder-val=\"{{ false }}\">\n            <div onclick=\"{{ toggleMobileNav }}\" style=\"position:absolute;top:14px;left:14px;z-index:70;display:flex;align-items:center;gap:8px;background:#2B1D14;color:#F1EBE0;padding:9px 14px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;box-shadow:0 4px 14px rgba(36,24,18,0.25)\"><span style=\"font-size:16px\">☰<\u002Fspan> เมนู<\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ showNavBackdrop }}\" hint-placeholder-val=\"{{ false }}\">\n            <div onclick=\"{{ closeMobileNav }}\" style=\"position:absolute;inset:0;background:rgba(36,24,18,0.5);z-index:70\"><\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ isDashboard }}\" hint-placeholder-val=\"{{ true }}\">\n          <div>\n            <div style=\"position:sticky;top:0;z-index:8;background:#F1EBE0;margin:0 -32px 0;padding:26px 32px 14px;display:flex;align-items:center;justify-content:space-between\">\n              <div>\n                <div style=\"font-size:21px;font-weight:700;color:#241812\">แดชบอร์ด<\u002Fdiv>\n                <div style=\"font-size:12.5px;color:#7C6E5F;margin-top:2px\">ภาพรวมประจำเดือนกรกฎาคม 2569<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display:flex;gap:14px;margin-bottom:18px\">\n              <div style=\"flex:1;background:#FFFFFF;border-top:3px solid #D9A15B;border-radius:8px;padding:16px;box-sizing:border-box\">\n                <div style=\"font-size:11px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;color:#7C6E5F;margin-bottom:8px\">รายรับเดือนนี้<\u002Fdiv>\n                <div style=\"font-family:'IBM Plex Mono',monospace;font-size:24px;font-weight:600;color:#241812\">{{ kpiPaidSum }}<\u002Fdiv>\n                <div style=\"font-size:12px;color:#3B7A52;margin-top:6px;font-weight:500\">อัปเดตตามยอดชำระจริง<\u002Fdiv>\n              <\u002Fdiv>\n              <div onclick=\"{{ goExpenses }}\" style=\"flex:1;background:#FFFFFF;border-top:3px solid #D9A15B;border-radius:8px;padding:16px;box-sizing:border-box;cursor:pointer\">\n                <div style=\"font-size:11px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;color:#7C6E5F;margin-bottom:8px\">รายจ่ายเดือนนี้<\u002Fdiv>\n                <div style=\"font-family:'IBM Plex Mono',monospace;font-size:24px;font-weight:600;color:#241812\">{{ kpiExpenseSum }}<\u002Fdiv>\n                <div style=\"font-size:12px;color:#7C6E5F;margin-top:6px\">ดูบัญชีรายจ่ายทั้งหมด<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"flex:1;background:#FFFFFF;border-top:3px solid {{ kpiNetBorder }};border-radius:8px;padding:16px;box-sizing:border-box\">\n                <div style=\"font-size:11px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;color:#7C6E5F;margin-bottom:8px\">{{ kpiNetLabel }}<\u002Fdiv>\n                <div style=\"font-family:'IBM Plex Mono',monospace;font-size:24px;font-weight:600;color:{{ kpiNetColor }}\">{{ kpiNetDisplay }}<\u002Fdiv>\n                <div style=\"font-size:12px;margin-top:6px;font-weight:500;color:{{ kpiNetColor }}\">{{ kpiNetHint }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"flex:1;background:#FFFFFF;border-top:3px solid #D9A15B;border-radius:8px;padding:16px;box-sizing:border-box\">\n                <div style=\"font-size:11px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;color:#7C6E5F;margin-bottom:8px\">ห้องว่าง<\u002Fdiv>\n                <div style=\"font-family:'IBM Plex Mono',monospace;font-size:24px;font-weight:600;color:#241812\">{{ kpiVacantFraction }}<\u002Fdiv>\n                <div style=\"font-size:12px;color:#7C6E5F;margin-top:6px\">คลิกการ์ดห้องพักด้านล่าง<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"flex:1;background:#FFFFFF;border-top:3px solid #B24336;border-radius:8px;padding:16px;box-sizing:border-box\">\n                <div style=\"font-size:11px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;color:#7C6E5F;margin-bottom:8px\">ค้างชำระ<\u002Fdiv>\n                <div style=\"font-family:'IBM Plex Mono',monospace;font-size:24px;font-weight:600;color:#B24336\">{{ kpiOverdueCount }}<\u002Fdiv>\n                <div style=\"font-size:12px;color:#7C6E5F;margin-top:6px\">{{ kpiOverdueSum }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display:flex;gap:14px;margin-bottom:14px\">\n              <div style=\"flex:1.3;background:#FFFFFF;border-radius:8px;padding:18px;box-sizing:border-box\">\n                <div style=\"font-size:14px;font-weight:600;color:#241812;margin-bottom:2px\">รายรับ-รายจ่าย 6 เดือนล่าสุด<\u002Fdiv>\n                <div style=\"font-size:11.5px;color:#7C6E5F;margin-bottom:14px\">กุมภาพันธ์ - กรกฎาคม 2569<\u002Fdiv>\n                <div style=\"display:flex;align-items:flex-end;gap:16px;height:100px\">\n                  <div style=\"display:flex;flex-direction:column;align-items:center;gap:6px;flex:1\"><div style=\"display:flex;align-items:flex-end;gap:3px;height:80px\"><div style=\"width:13px;height:58px;background:#C1622D;border-radius:2px 2px 0 0\"><\u002Fdiv><div style=\"width:13px;height:15px;background:#EAD9C4;border-radius:2px 2px 0 0\"><\u002Fdiv><\u002Fdiv><div style=\"font-size:10.5px;color:#7C6E5F\">ก.พ.<\u002Fdiv><\u002Fdiv>\n                  <div style=\"display:flex;flex-direction:column;align-items:center;gap:6px;flex:1\"><div style=\"display:flex;align-items:flex-end;gap:3px;height:80px\"><div style=\"width:13px;height:63px;background:#C1622D;border-radius:2px 2px 0 0\"><\u002Fdiv><div style=\"width:13px;height:12px;background:#EAD9C4;border-radius:2px 2px 0 0\"><\u002Fdiv><\u002Fdiv><div style=\"font-size:10.5px;color:#7C6E5F\">มี.ค.<\u002Fdiv><\u002Fdiv>\n                  <div style=\"display:flex;flex-direction:column;align-items:center;gap:6px;flex:1\"><div style=\"display:flex;align-items:flex-end;gap:3px;height:80px\"><div style=\"width:13px;height:66px;background:#C1622D;border-radius:2px 2px 0 0\"><\u002Fdiv><div style=\"width:13px;height:17px;background:#EAD9C4;border-radius:2px 2px 0 0\"><\u002Fdiv><\u002Fdiv><div style=\"font-size:10.5px;color:#7C6E5F\ v>\n                  <div style=\"display:flex;flex-direction:column;gap:6px\">\n                    <div style=\"display:flex;align-items:center;gap:8px\">\n                      <div style=\"display:flex;gap:3px;background:#F7F2E9;padding:2px;border-radius:6px;width:fit-content\">\n                        <span onclick=\"{{ t.onSetAuto }}\" style=\"font-size:10px;font-weight:600;padding:3px 9px;border-radius:4px;cursor:pointer;background:{{ t.autoBg }};color:{{ t.autoColor }}\">Auto (LINE)<\u002Fspan>\n                        <span onclick=\"{{ t.onSetManual }}\" style=\"font-size:10px;font-weight:600;padding:3px 9px;border-radius:4px;cursor:pointer;background:{{ t.manualBg }};color:{{ t.manualColor }}\">กรอกเอง<\u002Fspan>\n                      <\u002Fdiv>\n                      <span style=\"display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:5px;background:{{ t.connBg }};color:{{ t.connColor }}\"><span style=\"width:6px;height:6px;border-radius:50%;background:{{ t.connDot }}\"><\u002Fspan>{{ t.connLabel }}<\u002Fspan>\n                    <\u002Fdiv>\n                    <sc-if value=\"{{ t.isManual }}\" hint-placeholder-val=\"{{ false }}\">\n                      <div><span onclick=\"{{ t.onOpenConn }}\" style=\"display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:6px 12px;border-radius:6px;cursor:pointer;background:{{ t.tokenBg }};color:{{ t.tokenColor }};font-family:'IBM Plex Mono',monospace\">{{ t.tokenIcon }} {{ t.tokenLabel }}<\u002Fspan><\u002Fdiv>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                  <div><span onclick=\"{{ t.onSendNews }}\" style=\"display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:6px 12px;border-radius:6px;cursor:pointer;background:#EDE4D6;color:#B85B27\">✉ ส่งข่าวสาร<\u002Fspan><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\ BillsCount }})<\u002Fdiv>\n              <div style=\"font-size:12px;color:#7C6E5F;margin-bottom:16px\">สร้างบิลจะเพิ่มแถวที่นี่ · กดสถานะเพื่อยืนยันการชำระ เมื่อชำระแล้วแถวจะถูกนำออก<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:0.5fr 1.5fr 0.9fr 1.1fr 1fr 1.3fr;gap:12px;font-size:11px;font-weight:600;letter-spacing:0.03em;text-transform:uppercase;color:#9C8B78;padding-bottom:11px;border-bottom:2px solid #EDE1CE\">\n                <div>ห้อง<\u002Fdiv><div>ผู้เช่า<\u002Fdiv><div>ยอดรวม<\u002Fdiv><div>วันครบกำหนด<\u002Fdiv><div>สถานะ<\u002Fdiv><div style=\"text-align:right\">ส่งข้อมูล<\u002Fdiv>\n              <\u002Fdiv>\n              <sc-if value=\"{{ pendingBillsCount }}\" hint-placeholder-val=\"{{ true }}\">\n                <sc-for list=\"{{ pendingBills }}\" as=\"b\" hint-placeholder-count=\"6\">\n                  <div style=\"display:grid;grid-template-columns:0.5fr 1.5fr 0.9fr 1.1fr 1fr 1.3fr;gap:12px;font-size:12.5px;color:#241812;padding:13px 0;border-bottom:1px solid #F3ECE0;align-items:center\">\n                    <div style=\"font-weight:700;font-family:'IBM Plex Mono',monospace\">{{ b.room }}<\u002Fdiv>\n                    <div style=\"font-weight:500\">{{ b.tenant }}<\u002Fdiv>\n                    <div style=\"font-family:'IBM Plex Mono',monospace;font-weight:600\">{{ b.totalDisplay }}<\u002Fdiv>\n                    <div style=\"color:#7C6E5F;font-size:12px\">{{ b.due }}<\u002Fdiv>\n                    <div><span onclick=\"{{ b.onMarkPaid }}\" style=\"display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;padding:5px 11px;border-radius:6px;cursor:pointer;background:{{ b.statusBg }};color:{{ b.statusColor }}\"><span style=\"width:6px;height:6px;border-radius:50%;background:{{ b.statusDot }}\"><\u002Fspan>{{ b.statusLabel }}<\u002Fspan><\u002Fdiv>\n                    <div style=\"text-align:right\"><span onclick=\"{{ b.onSendLine }}\" style=\"display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;padding:7px 13px;border-radius:6px;cursor:pointer;background:{{ b.sendBg }};color:{{ b.sendColor }}\">{{ b.sendLabel }}<\u002Fspan><\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ noPendingBills }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"text-align:center;padding:32px;color:#A89A88;font-size:12.5px\">ไม่มีบิลค้างชำระ — กด \"+ สร้างใบแจ้งหนี้\" เพื่อเพิ่ม<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ isMaintenance }}\" hint-placeholder-val=\"{{ false }}\">\n          <div>\n            <div style=\"position:sticky;top:0;z-index:8;background:#F1EBE0;margin:0 -32px 0;padding:26px 32px 14px;display:flex;align-items:center;justify-content:space-between\">\n              <div>\n                <div style=\"font-size:21px;font-weight:700;color:#241812\">แจ้งซ่อม<\u002Fdiv>\n                <div style=\"font-size:12.5px;color:#7C6E5F;margin-top:2px\">คลิกสถานะเพื่ออัปเดตความคืบหน้า<\u002Fdiv>\n              <\u002Fdiv>\n              <button onclick=\"{{ openMaintenanceModal }}\" style=\"background:#C1622D;color:#fff;border:none;border-radius:7px;padding:10px 16px;font-size:13px;font-weight:600;cursor:pointer\">+ แจ้งปัญหาใหม่<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"background:#FFFFFF;border-radius:8px;padding:18px;box-sizing:border-box\">\n              <div style=\"display:grid;grid-template-columns:0.6fr 1.6fr 0.9fr 1.7fr;gap:10px;font-size:11px;font-weight:600;letter-spacing:0.03em;text-transform:uppercase;color:#7C6E5F;padding-bottom:10px;border-bottom:1px solid #E3D8C8\">\n                <div>ห้อง<\u002Fdiv><div>ปัญหา<\u002Fdiv><div>วันที่แจ้ง<\u002Fdiv><div>สถานะ<\u002Fdiv>\n              <\u002Fdiv>\n              <sc-for list=\"{{ maintenanceView }}\" as=\"m\" hint-placeholder-count=\"4\">\n lay:flex;flex-direction:column;gap:14px\">\n                <div>\n                  <div style=\"font-size:11.5px;color:#7C6E5F;margin-bottom:5px\">ชื่อหอพัก<\u002Fdiv>\n                  <input value=\"{{ propertyProfile.name }}\" onchange=\"{{ onProfileName }}\" placeholder=\"เช่น หอพักเช่าสุข\" style=\"width:100%;padding:10px;border-radius:6px;border:1px solid #E3D8C8;font-size:12.5px;box-sizing:border-box\">\n                <\u002Fdiv>\n                <div style=\"display:flex;gap:12px\">\n                  <div style=\"flex:1.4\">\n                    <div style=\"font-size:11.5px;color:#7C6E5F;margin-bottom:5px\">ผู้ดูแล<\u002Fdiv>\n                    <input value=\"{{ propertyProfile.adminName }}\" onchange=\"{{ onProfileAdmin }}\" placeholder=\"ชื่อผู้ดูแล\" style=\"width:100%;padding:10px;border-radius:6px;border:1px solid #E3D8C8;font-size:12.5px;box-sizing:border-box\">\n                  <\u002Fdiv>\n                  <div style=\"flex:1\">\n                    <div style=\"font-size:11.5px;color:#7C6E5F;margin-bottom:5px\">เบอร์ติดต่อผู้ดูแล<\u002Fdiv>\n                    <input value=\"{{ propertyProfile.adminPhone }}\" onchange=\"{{ onProfilePhone }}\" placeholder=\"08x-xxx-xxxx\" style=\"width:100%;padding:10px;border-radius:6px;border:1px solid #E3D8C8;font-size:12.5px;box-sizing:border-box;font-family:'IBM Plex Mono',monospace\">\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:flex;justify-content:flex-end\">\n                  <div onclick=\"{{ saveProfile }}\" style=\"padding:10px 22px;border-radius:7px;background:#C1622D;color:#fff;font-size:13px;font-weight:700;cursor:pointer\">บันทึกข้อมูล<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"background:#FFFFFF;border-radius:8px;padding:8px 20px;box-sizing:border-box;max-width:560px\">\n              <sc-for list=\"{{ settingsToggles }}\" as=\"t\" hint-placeholder-count=\"4\">\n                <div style=\"display:flex;align-items:center;justify-content:space-between;padding:16px 0;border-bottom:1px solid #F0E9DC\">\n                  <div>\n                    <div style=\"font-size:13.5px;font-weight:600;color:#241812\">{{ t.label }}<\u002Fdiv>\n                    <div style=\"font-size:11.5px;color:#7C6E5F;margin-top:2px\">{{ t.desc }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"display:flex;align-items:center;gap:12px;flex-shrink:0\">\n                    <sc-if value=\"{{ t.hasConfig }}\" hint-placeholder-val=\"{{ false }}\">\n                      <div onclick=\"{{ t.onConfig }}\" style=\"font-size:11.5px;font-weight:600;color:#C1622D;padding:6px 12px;border:1px solid #E3D0BC;border-radius:6px;cursor:pointer;white-space:nowrap\">⚙ ตั้งค่า<\u002Fdiv>\n                    <\u002Fsc-if>\n                    <div onclick=\"{{ t.onClick }}\" style=\"width:44px;height:24px;border-radius:12px;position:relative;cursor:pointer;flex-shrink:0;background:{{ t.bg }}\">\n                      <div style=\"position:absolute;top:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left 0.15s ease;left:{{ t.knobLeft }}\"><\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <div style=\"background:#FFFFFF;border-radius:8px;padding:24px;box-sizing:border-box;max-width:560px;margin-top:16px\">\n              <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:4px\">\n                <span style=\"font-size:16px\">🔗<\u002Fspan>\n                <div style=\"font-size:15px;font-weight:700;color:#241812\">การเชื่อมต่อ Tuya Cloud<\u002Fdiv>\n                <span style=\"font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:5px;margin-left:auto;display:flex;align-items:center;gap:5px;background:{{ tuyaStatusBg }};color:{{ tuyaStatusColor }}\">\n                  <span style=\"width:6px;height:6px;border-radius:50%;background:{{ tuyaStatusDot }}\"><\u002Fspan>{{ tuyaStatusLabel }}\n                <\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"font-size:11.5px;color:#7C6E5F;margin-bottom:18px\">กรอกคีย์จาก Tuya IoT Platform เพื่อดึงสถานะอุปกรณ์แบบเรียลไทม์<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:14px\">\n                <div>\n                  <div style=\"font-size:11.5px;color:#7C6E5F;margin-bottom:5px\">Access ID / Client ID<\u002Fdiv>\n                  <input value=\"{{ tuyaConn.accessId }}\" onchange=\"{{ onTuyaAccessId }}\" placeholder=\"เช่น 9xa8k7pq3vwd...\" style=\"width:100%;padding:10px;border-radius:6px;border:1px solid #E3D8C8;font-size:12.5px;box-sizing:border-box;font-family:'IBM Plex Mono',monospace\">\n                <\u002Fdiv>\n                <div>\n                  <div style=\"font-size:11.5px;color:#7C6E5F;margin-bottom:5px\">Access Secret / Client Secret<\u002Fdiv>\n                  <input type=\"password\" value=\"{{ tuyaConn.accessSecret }}\" onchange=\"{{ onTuyaAccessSecret }}\" placeholder=\"••••••••••••••••\" style=\"width:100%;padding:10px;border-radius:6px;border:1px solid #E3D8C8;font-size:12.5px;box-sizing:border-box;font-family:'IBM Plex Mono',monospace\">\n                <\u002Fdiv>\n                <div>\n                  <div style=\"font-size:11.5px;color:#7C6E5F;margin-bottom:5px\">ศูนย์ข้อมูล (Data Center)<\u002Fdiv>\n                  <select value=\"{{ tuyaConn.region }}\" onchange=\"{{ onTuyaRegion }}\" style=\"width:100%;padding:10px;border-radius:6px;border:1px solid #E3D8C8;font-size:12.5px;box-sizing:border-box;background:#fff\">\n                    <sc-for list=\"{{ tuyaRegionOptions }}\" as=\"reg\" hint-placeholder-count=\"4\">\n                      <option value=\"{{ reg }}\">{{ reg }}<\u002Foption>\n                    <\u002Fsc-for>\n                  <\u002Fselect>\n                <\u002Fdiv>\n                <div style=\"display:flex;gap:10px;margin-top:4px\">\n                  <div onclick=\"{{ connectTuya }}\" style=\"flex:1;padding:11px;border-radius:7px;background:#C1622D;color:#fff;font-size:13px;font-weight:700;text-align:center;cursor:pointer\">เชื่อมต่อ<\u002Fdiv>\n                  <sc-if value=\"{{ tuyaConnected }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div onclick=\"{{ disconnectTuya }}\" style=\"padding:11px 18px;border-radius:7px;border:1px solid #D8C9B4;color:#7C6E5F;font-size:13px;font-weight:600;text-align:center;cursor:pointer\">ยกเลิกการเชื่อมต่อ<\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"background:#FFFFFF;border-radius:8px;padding:24px;box-sizing:border-box;max-width:560px;margin-top:16px\">\n              <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:4px\">\n                <span style=\"width:22px;height:22px;border-radius:6px;background:#06C755;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center\">L<\u002Fspan>\n                <div style=\"font-size:15px;font-weight:700;color:#241812\">การเชื่อมต่อ LINE Official Account<\u002Fdiv>\n                <span style=\"font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:5px;margin-left:auto;display:flex;align-items:center;gap:5px;background:{{ lineStatusBg }};color:{{ lineStatusColor }}\">\n                  <span style=\"width:6px;height:6px;border-radius:50%;background:{{ lineStatusDot }}\"><\u002Fspan>{{ lineStatusLabel }}\n                <\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"font-size:11.5px;color:#7C6E5F;margin-bottom:18px\">เชื่อม LINE OA เพื่อส่งแจ้งเตือนบิลและกำหนดชำระให้ผู้เช่าผ่าน LINE (Messaging API)<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:14px\">\n                <div>\n                  <div style=\"font-siz D8C8;font-size:12.5px;box-sizing:border-box;font-family:'IBM Plex Mono',monospace\">\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <!-- SECTION: rates -->\n              <div style=\"background:#FFFFFF;border-radius:8px;padding:20px;box-sizing:border-box;margin-bottom:14px\">\n                <div style=\"font-size:12px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:#C1622D;margin-bottom:14px\">อัตราค่าบริการ<\u002Fdiv>\n                <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px\">\n                  <div>\n                    <div style=\"font-size:11.5px;color:#7C6E5F;margin-bottom:5px\">ค่าน้ำ / หน่วย (บาท)<\u002Fdiv>\n                    <input value=\"{{ cf.waterRate }}\" onchange=\"{{ onCfWater }}\" placeholder=\"18\" style=\"width:100%;padding:9px;border-radius:6px;border:1px solid #E3D8C8;font-size:12.5px;box-sizing:border-box;font-family:'IBM Plex Mono',monospace\">\n                  <\u002Fdiv>\n                  <div>\n                    <div style=\"font-size:11.5px;color:#7C6E5F;margin-bottom:5px\">ค่าไฟ / หน่วย (บาท)<\u002Fdiv>\n                    <input value=\"{{ cf.elecRate }}\" onchange=\"{{ onCfElec }}\" placeholder=\"8\" style=\"width:100%;padding:9px;border-radius:6px;border:1px solid #E3D8C8;font-size:12.5px;box-sizing:border-box;font-family:'IBM Plex Mono',monospace\">\n                  <\u002Fdiv>\n                  <div>\n                    <div style=\"font-size:11.5px;color:#7C6E5F;margin-bottom:5px\">ค่าเก็บขยะ / เดือน (บาท)<\u002Fdiv>\n                    <input value=\"{{ cf.trashRate }}\" onchange=\"{{ onCfTrash }}\" placeholder=\"40\" style=\"width:100%;padding:9px;border-radius:6px;border:1px solid #E3D8C8;font-size:12.5px;box-sizing:border-box;font-family:'IBM Plex Mono',monospace\">\n                  <\u002Fdiv>\n                  <div>\n                    <div style=\"font-size:11.5px;color:#7C6E5F;margin-bottom:5px\">ค่า I e\">\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:grid;grid-template-columns:1.4fr 1fr;gap:14px;align-items:end\">\n                  <div>\n                    <div style=\"font-size:11.5px;color:#7C6E5F;margin-bottom:5px\">รูปบัตรประชาชนผู้เช่า<\u002Fdiv>\n                    <label style=\"display:flex;align-items:center;gap:10px;padding:10px;border:1px dashed #C9B79E;border-radius:6px;cursor:pointer;background:#FBF7F0\">\n                      {{ cfTenantIdPreview }}\n                      <span style=\"font-size:12px;color:#7C6E5F\">📎 เลือกรูปบัตรประชาชน<\u002Fspan>\n                      <input type=\"file\" accept=\"image/*\" onchange=\"{{ onCfTenantId }}\" style=\"display:none\">\n                    <\u002Flabel>\n                  <\u002Fdiv>\n                  <div>\n                    <div style=\"font-size:11.5px;color:#7C6E5F;margin-bottom:5px\">วันหมดอายุบัตร<\u002Fdiv>\n                    <input type=\"date\" value=\"{{ cf.tenantIdExpiry }}\" onchange=\"{{ onCfTenantExpiry }}\" style=\"width:100%;padding:9px;border-radius:6px;border:1px solid #E3D8C8;font-size:12.5px;box-sizing:border-box\">\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <!-- SECTION: owner -->\n              <div style=\"background:#FFFFFF;border-radius:8px;padding:20px;box-sizing:border-box;margin-bottom:14px\">\n                <div style=\"font-size:12px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:#C1622D;margin-bottom:14px\">ข้อมูลเจ้าของ / ผู้ให้เช่า<\u002Fdiv>\n                <div style=\"display:grid;grid-template-columns:1.4fr 1fr;gap:14px;align-items:end\">\n                  <div>\n                    <div style=\"font-size:11.5px;color:#7C6E5F;margin-bottom:5px\">รูปบัตรประชาชนเจ้าของ<\u002Fdiv>\n                    <label style=\"display:flex;align-items:center;gap:10px;padding:10px;border:1px dashed #C9B79E;border-radius:6px;cursor:pointer;background:#FBF7F0\">\n                      {{ cfOwnerIdPreview }}\n                      <span style=\"font-size:12px;color:#7C6E5F\">📎 เลือกรูปบัตรประชาชน<\u002Fspan>\n                      <input type=\"file\" accept=\"image/*\" onchange=\"{{ onCfOwnerId }}\" style=\"display:none\">\n                    <\u002Flabel>\n                  <\u002Fdiv>\n                  <div>\n                    <div style=\"font-size:11.5px;color:#7C6E5F;margin-bottom:5px\">วันหมดอายุบัตร<\u002Fdiv>\n                    <input type=\"date\" value=\"{{ cf.ownerIdExpiry }}\" onchange=\"{{ onCfOwnerExpiry }}\" style=\"width:100%;padding:9px;border-radius:6px;border:1px solid #E3D8C8;font-size:12.5px;box-sizing:border-box\">\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <!-- SECTION: wifi + terms -->\n              <div style=\"background:#FFFFFF;border-radius:8px;padding:20px;box-sizing:border-box;margin-bottom:14px\">\n                <div style=\"font-size:12px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:#C1622D;margin-bottom:14px\">WiFi และเงื่อนไขการชำระ<\u002Fdiv>\n                <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px\">\n                  <div>\n                    <div style=\"font-size:11.5px;color:#7C6E5F;margin-bottom:5px\">รหัส WiFi ห้อง<\u002Fdiv>\n                    <input value=\"{{ cf.wifiCode }}\" onchange=\"{{ onCfWifi }}\" placeholder=\"room302wifi\" style=\"width:100%;padding:9px;border-radius:6px;border:1px solid #E3D8C8;font-size:12.5px;box-sizing:border-box;font-family:'IBM Plex Mono',monospace\">\n                  <\u002Fdiv>\n                  <div>\n                    <div style=\"font-size:11.5px;color:#7C6E5F;margin-bottom:5px\">กำหนดชำระทุกวันที่ (ของเดือน)<\u002Fdiv>\n                    <input value=\"{{ cf.dueDay }}\" onchange=\"{{ onCfDueDay }}\" placeholder=\"5\" style=\"width:100%;padding:9px;border-radius:6px;border:1px solid #E3D8C8;font-size:12.5px;box-sizing:border-box;font-family:'IBM Plex Mono',monospace\">\n                  <\u002Fdiv>\n                  <div>\n                    <div style=\"font-size:11.5px;color:#7C6E5F;margin-bottom:5px\">วันเริ่มสัญญา<\u002Fdiv>\n                    <input type=\"date\" value=\"{{ cf.startDate }}\" onchange=\"{{ onCfStart }}\" style=\"width:100%;padding:9px;border-radius:6px;border:1px solid #E3D8C8;font-size:12.5px;box-sizing:border-box\">\n                  <\u002Fdiv>\n                  <div>\n                    <div style=\"font-size:11.5px;color:#7C6E5F;margin-bottom:5px\">วันสิ้นสุดสัญญา<\u002Fdiv>\n                    <input type=\"date\" value=\"{{ cf.endDate }}\" onchange=\"{{ onCfEnd }}\" style=\"width:100%;padding:9px;border-radius:6px;border:1px solid #E3D8C8;font-size:12.5px;box-sizing:border-box\">\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"margin-top:14px\">\n                  <div style=\"font-size:11.5px;color:#7C6E5F;margin-bottom:5px\">เอกสารสัญญาเช่า (PDF / รูป)<\u002Fdiv>\n                  <label style=\"display:flex;align-items:center;gap:10px;padding:10px;border:1px dashed #C9B79E;border-radius:6px;cursor:pointer;background:#FBF7F0\">\n                    <span style=\"font-size:12px;color:#7C6E5F\">📄 <sc-if value=\"{{ cfHasLeaseDoc }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"color:#C1622D;font-weight:600\">{{ cf.leaseDocName }}<\u002Fspan><\u002Fsc-if><sc-if value=\"{{ cfHasLeaseDoc }}\" hint-placeholder-val=\"{{ true }}\"><\u002Fsc-if><\u002Fspan>\n                    <span style=\"font-size:12px;color:#7C6E5F\">แนบเอกสารสัญญา<\u002Fspan>\n                    <input type=\"file\" accept=\".pdf,image/*\" onchange=\"{{ onCfLeaseDoc }}\" style=\"display:none\">\n                  <\u002Flabel>\n                <\u002Fdiv>\n                <div style=\"margin-top:14px\">\n                  <div style=\"font-size:11.5px;color:#7C6E5F;margin-bottom:5px\">QR code LINE OA (ให้ผู้เช่าสแกนเพิ่มเพื่อน)<\u002Fdiv>\n                  <div style=\"display:flex;align-items:center;gap:12px\">\n                    <sc-if value=\"{{ cfHasLineQr }}\" hint-placeholder-val=\"{{ false }}\">\n                      <div style=\"position:relative\">\n                        {{ cfLineQrPreview }}\n                        <div onclick=\"{{ removeCfLineQr }}\" style=\"position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:#B24336;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;line-height:1\">×<\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fsc-if>\n                    <label style=\"flex:1;display:flex;align-items:center;gap:10px;padding:12px;border:1px dashed #C9B79E;border-radius:6px;cursor:pointer;background:#FBF7F0\">\n                      <span style=\"width:22px;height:22px;border-radius:6px;background:#06C755;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center\">L<\u002Fspan>\n                      <span style=\"font-size:12px;color:#7C6E5F\">อัปโหลด / อัปเดต QR code LINE OA<\u002Fspan>\n                      <input type=\"file\" accept=\"image/*\" onchange=\"{{ onCfLineQr }}\" style=\"display:none\">\n                    <\u002Flabel>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"display:flex;gap:12px;justify-content:flex-end;align-items:center\">\n                <div onclick=\"{{ openLeaseDocs }}\" style=\"margin-right:auto;padding:11px 18px;border-radius:7px;border:1px solid #D8C9B4;color:#7C6E5F;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px\">📄 ไฟล์สัญญาทั้งหมด<\u002Fdiv>\n                <div onclick=\"{{ closeContractForm }}\" style=\"padding:11px 22px;border-radius:7px;border:1px solid #D8C9B4;color:#7C6E5F;font-size:13px;font-weight:600;cursor:pointer\">ยกเลิก<\u002Fdiv>\n                <div onclick=\"{{ saveContractForm }}\" style=\"padding:11px 26px;border-radius:7px;background:#C1622D;color:#fff;font-size:13px;font-weight:700;cursor:pointer\">บันทึกสัญญา<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ isCalendar }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column\">\n            <div style=\"position:sticky;top:0;z-index:8;background:#F1EBE0;margin:0 -32px 0;padding:26px 32px 14px;display:flex;align-items:center;justify-content:space-between\">\n              <div>\n                <div style=\"font-size:21px;font-weight:700;color:#241812\">ปฏิทินงาน<\u002Fdiv>\n                <div style=\"font-size:12.5px;color:#7C6E5F;margin-top:2px\">บันทึกนัดหมาย กำหนดชำระ และงานที่ต้องติดตาม · {{ upcomingCount }} รายการที่จะถึง<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display:grid;grid-template-columns:1.5fr 1fr;gap:16px;align-items:start\">\n              <div style=\"background:#FFFFFF;border-radius:8px;padding:20px;box-sizing:border-box\">\n                <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:16px\">\n                  <div onclick=\"{{ calPrevMonth }}\" style=\"width:32px;height:32px;border-radius:7px;border:1px solid #E3D8C8;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#7C6E5F;font-size:15px\">‹<\u002Fdiv>\n                  <div style=\"font-size:16px;font-weight:700;color:#241812\">{{ calMonthLabel }}<\u002Fdiv>\n                  <div onclick=\"{{ calNextMonth }}\" style=\"width:32px;height:32px;border-radius:7px;border:1px solid #E3D8C8;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#7C6E5F;font-size:15px\">›<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px\">\n                  <sc-for list=\"{{ calWeekdays }}\" as=\"w\" hint-placeholder-count=\"7\">\n                    <div style=\"text-align:center;font-size:11px;font-weight:600;color:#7C6E5F;padding:4px 0\">{{ w }}<\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"display:grid;grid-template-columns:repeat(7,1fr);gap:4px\">\n                  <sc-for list=\"{{ calCells }}\" as=\"c\" hint-placeholder-count=\"35\">\n                    <sc-if value=\"{{ c.blank }}\" hint-placeholder-val=\"{{ false }}\">\n                      <div style=\"aspect-ratio:1\"><\u002Fdiv>\n                    <\u002Fsc-if>\n                    <sc-if value=\"{{ c.day }}\" hint-placeholder-val=\"{{ true }}\">\n                      <div onclick=\"{{ c.onPick }}\" style=\"aspect-ratio:1;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;background:{{ c.cellBg }}\">\n                        <span style=\"font-size:13px;font-weight:600;color:{{ c.cellColor }};font-family:'IBM Plex Mono',monospace\">{{ c.day }}<\u002Fspan>\n                        <div style=\"width:5px;height:5px;border-radius:50%;background:{{ c.dotColor }}\"><\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fsc-if>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"background:#FFFFFF;border-radius:8px;padding:20px;box-sizing:border-box\">\n                <div style=\"font-size:14px;font-weight:700;color:#241812;margin-bottom:14px\">เพิ่มรายการวันที่ {{ selectedDateLabel }}<\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:12px\">\n                  <div>\n                    <div style=\"font-size:11.5px;color:#7C6E5F;margin-bottom:5px\">รายการ / งาน<\u002Fdiv>\n                    <input value=\"{{ calEventForm.title }}\" onchange=\"{{ onCalTitle }}\" placeholder=\"เช่น ตามบิลห้อง 305\" style=\"width:100%;padding:9px;border-radius:6px;border:1px solid #E3D8C8;font-size:12.5px;box-sizing:border-box\">\n                  <\u002Fdiv>\n                  <div style=\"display:flex;gap:10px\">\n                    <div style=\"flex:1\">\n                      <div style=\"font-size:11.5px;color:#7C6E5F;margin-bottom:5px\">เวลา<\u002Fdiv>\n                      <input value=\"{{ calEventForm.time }}\" onchange=\"{{ onCalTime }}\" placeholder=\"09:00\" style=\"width:100%;padding:9px;border-radius:6px;border:1px solid #E3D8C8;font-size:12.5px;box-sizing:border-box;font-family:'IBM Plex Mono',monospace\">\n                    <\u002Fdiv>\n                    <div style=\"flex:1.3\">\n                      <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:5px\">\n                        <div style=\"font-size:11.5px;color:#7C6E5F\">ประเภท<\u002Fdiv>\n                        <span onclick=\"{{ toggleAddCalType }}\" style=\"font-size:11px;color:#C1622D;font-weight:600;cursor:pointer\">+ เพิ่ม<\u002Fspan>\n                      <\u002Fdiv>\n                      <select value=\"{{ calEventForm.type }}\" onchange=\"{{ onCalType }}\" style=\"width:100%;padding:9px;border-radius:6px;border:1px solid #E3D8C8;font-size:12.5px;box-sizing:border-box;background:#fff\">\n                        <sc-for list=\"{{ calEventTypeOptions }}\" as=\"t\" hint-placeholder-count=\"6\">\n                          <option value=\"{{ t }}\">{{ t }}<\u002Foption>\n                        <\u002Fsc-for>\n                      <\u002Fselect>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                  <sc-if value=\"{{ addingCalType }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"display:flex;gap:8px\">\n                      <input value=\"{{ newCalTypeText }}\" onchange=\"{{ onNewCalTypeText }}\" placeholder=\"ชื่อประเภทใหม่\" style=\"flex:1;padding:9px;border-radius:6px;border:1px solid #E3D8C8;font-size:12.5px;box-sizing:border-box\">\n                      <div onclick=\"{{ confirmNewCalType }}\" style=\"padding:9px 16px;border-radius:6px;background:#C1622D;color:#fff;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap\">เพิ่มประเภท<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                  <div onclick=\"{{ addCalEvent }}\" style=\"margin-top:2px;padding:11px;border-radius:7px;background:#C1622D;color:#fff;font-size:13px;font-weight:700;text-align:center;cursor:pointer\">+ บันทึกลงปฏิทิน<\u002Fdiv>\n                  <div onclick=\"{{ openBroadcast }}\" style=\"padding:11px;border-radius:7px;background:#06C755;color:#fff;font-size:13px;font-weight:700;text-align:center;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px\">📢 ส่งแจ้งเตือนทาง LINE<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display:grid;grid-template-columns:1.5fr 1fr;gap:16px;align-items:start;margin-top:16px\">\n              <div style=\"background:#FFFFFF;border-radius:8px;padding:20px;box-sizing:border-box\">\n                <div style=\"font-size:14px;font-weight:700;color:#241812;margin-bottom:2px\">รายการวันที่ {{ selectedDateLabel }}<\u002Fdiv>\n                <div style=\"font-size:12px;color:#7C6E5F;margin-bottom:14px\">{{ selectedDayCount }} รายการ<\u002Fdiv>\n                <sc-if value=\"{{ selectedDayCount }}\" hint-placeholder-val=\"{{ true }}\">\n                  <div style=\"display:flex;flex-direction:column;gap:9px\">\n                    <sc-for list=\"{{ selectedDayEvents }}\" as=\"e\" hint-placeholder-count=\"2\">\n                      <div style=\"display:flex;align-items:center;gap:12px;padding:11px 12px;border:1px solid #F0E9DC;border-radius:8px\">\n                        <div style=\"font-size:12.5px;font-weight:700;color:#241812;font-family:'IBM Plex Mono',monospace;min-width:44px\">{{ e.time }}<\u002Fdiv>\n                        <span style=\"font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:5px;color:{{ e.tColor }};background:{{ e.tBg }}\">{{ e.type }}<\u002Fspan>\n                        <div style=\"flex:1;font-size:12.5px;color:#241812\">{{ e.title }}<\u002Fdiv>\n                        <span onclick=\"{{ e.onDelete }}\" style=\"font-size:11px;color:#B24336;cursor:pointer;font-weight:600\">ลบ<\u002Fspan>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ selectedDayCount }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"text-align:center;padding:24px;color:#A89A88;font-size:12.5px\">ยังไม่มีรายการในวันนี้ — เพิ่มได้จากช่องด้านบน<\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n\n              <div style=\"background:#241812;border-radius:8px;padding:20px;box-sizing:border-box\">\n                <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:14px\">\n                  <span style=\"font-size:15px\">🔔<\u002Fspan>\n                  <div style=\"font-size:14px;font-weight:700;color:#F1EBE0\">รายการแจ้งเตือนที่จะถึง<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:9px\">\n                  <sc-for list=\"{{ upcomingReminders }}\" as=\"r\" hint-placeholder-count=\"5\">\n                    <div style=\"background:rgba(241,235,224,0.07);border-radius:8px;padding:11px 12px\">\n                      <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:5px\">\n                        <span style=\"font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:5px;color:{{ r.tColor }};background:{{ r.tBg }}\">{{ r.type }}<\u002Fspan>\n                        <span style=\"font-size:11px;color:#C1A98A;font-weight:600\">{{ r.whenLabel }}<\u002Fspan>\n                      <\u002Fdiv>\n                      <div style=\"font-size:12.5px;color:#F1EBE0;line-height:1.4\">{{ r.title }}<\u002Fdiv>\n                      <div style=\"font-size:11px;color:#9C8B78;margin-top:3px;font-family:'IBM Plex Mono',monospace\">{{ r.dateLabel }} · {{ r.time }} น.<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ showExpenseModal }}\">\n          <div onclick=\"{{ closeExpenseModal }}\" style=\"position:absolute;inset:0;background:rgba(36,24,18,0.45);display:flex;align-items:center;justify-content:center;z-index:200\">\n            <div onclick=\"{{ stop }}\" style=\"background:#FFFFFF;border-radius:12px;padding:24px;width:360px;box-sizing:border-box\">\n              <div style=\"font-size:16px;font-weight:700;color:#241812;margin-bottom:16px\">เพิ่มรายจ่ายใหม่<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:12px\">\n                <div>\n                  <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:5px\">\n                    <div style=\"font-size:11.5px;color:#7C6E5F\">หมวดหมู่<\u002Fdiv>\n                    <span onclick=\"{{ toggleAddCategory }}\" style=\"font-size:11px;color:#C1622D;font-weight:600;cursor:pointer\">+ เพิ่มหมวดหมู่<\u002Fspan>\n                  <\u002Fdiv>\n                  <select value=\"{{ newExpense.category }}\" onchange=\"{{ onExpenseCategoryChange }}\" style=\"width:100%;padding:9px;border-radius:6px;border:1px solid #E3D8C8;font-size:12.5px;box-sizing:border-box\">\n                    <sc-for list=\"{{ expenseCategoryOptions }}\" as=\"cat\" hint-placeholder-count=\"4\">\n                      <option value=\"{{ cat }}\">{{ cat }}<\u002Foption>\n                    <\u002Fsc-for>\n                  <\u002Fselect>\n                  <sc-if value=\"{{ addingCategory }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"display:flex;gap:8px;margin-top:8px\">\n                      <input value=\"{{ newCategoryText }}\" onchange=\"{{ onNewCategoryText }}\" placeholder=\"ชื่อหมวดหมู่ใหม่\" style=\"flex:1;padding:9px;border-radius:6px;border:1px solid #E3D8C8;font-size:12.5px;box-sizing:border-box\">\n                      <div onclick=\"{{ confirmNewCategory }}\" style=\"padding:9px 16px;border-radius:6px;background:#C1622D;color:#fff;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap\">เพิ่ม<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n                <div>\n                  <div style=\"font-size:11.5px;color:#7C6E5F;margin-bottom:5px\">รายละเอียด<\u002Fdiv>\n                  <input value=\"{{ newExpense.desc }}\" onchange=\"{{ onExpenseDescChange }}\" placeholder=\"เช่น ซ่อมปั๊มน้ำ\" style=\"width:100%;padding:9px;border-radius:6px;border:1px solid #E3D8C8;font-size:12.5px;box-sizing:border-box\">\n                <\u002Fdiv>\n                <div style=\"display:flex;gap:10px\">\n                  <div style=\"flex:1\">\n                    <div style=\"font-size:11.5px;color:#7C6E5F;margin-bottom:5px\">จำนวนเงิน<\u002Fdiv>\n                    <input value=\"{{ newExpense.amount }}\" onchange=\"{{ onExpenseAmountChange }}\" style=\"width:100%;padding:9px;border-radius:6px;border:1px solid #E3D8C8;font-size:12.5px;box-sizing:border-box;font-family:'IBM Plex Mono',monospace\">\n                  <\u002Fdiv>\n                  <div style=\"flex:1\">\n                    <div style=\"font-size:11.5px;color:#7C6E5F;margin-bottom:5px\">วันที่<\u002Fdiv>\n                    <input type=\"date\" value=\"{{ newExpense.date }}\" onchange=\"{{ onExpenseDateChange }}\" style=\"width:100%;padding:9px;border-radius:6px;border:1px solid #E3D8C8;font-size:12.5px;box-sizing:border-box\">\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;gap:10px;margin-top:20px\">\n                <button onclick=\"{{ closeExpenseModal }}\" style=\"flex:1;background:none;border:1px solid #E3D8C8;color:#241812;border-radius:6px;padding:10px;font-size:13px;font-weight:600;cursor:pointer\">ยกเลิก<\u002Fbutton>\n                <button onclick=\"{{ submitExpense }}\" style=\"flex:1;background:#C1622D;color:#fff;border:none;border-radius:6px;padding:10px;font-size:13px;font-weight:600;cursor:pointer\">บันทึก<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ showAutoInvoice }}\">\n          <div onclick=\"{{ closeAutoInvoice }}\" style=\"position:absolute;inset:0;background:rgba(36,24,18,0.45);display:flex;align-items:center;justify-content:center;z-index:215\">\n            <div onclick=\"{{ stop }}\" style=\"background:#FFFFFF;border-radius:12px;padding:24px;width:420px;max-width:92%;box-sizing:border-box;max-height:88%;overflow:auto\">\n              <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:4px\">\n                <span style=\"font-size:18px\">🧾<\u002Fspan>\n                <div style=\"font-size:16px;font-weight:700;color:#241812\">ตั้งค่าออกบิลอัตโนมัติ<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-size:12px;color:#7C6E5F;margin-bottom:16px\">เลือกวันออกบิลและห้องที่จะออกใบแจ้งหนี้อัตโนมัติ<\u002Fdiv>\n\n              <div style=\"font-size:11.5px;color:#7C6E5F;margin-bottom:5px\">ออกบิลทุกวันที่ (ของเดือน)<\u002Fdiv>\n              <input value=\"{{ autoInvoiceDay }}\" onchange=\"{{ onAutoInvoiceDay }}\" placeholder=\"1\" style=\"width:100%;padding:9px;border-radius:6px;border:1px solid #E3D8C8;font-size:12.5px;box-sizing:border-box;font-family:'IBM Plex Mono',monospace;margin-bottom:16px\">\n\n              <div onclick=\"{{ toggleAutoInvoiceAll }}\" style=\"display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;background:#FBF7F0;cursor:pointer;margin-bottom:8px\">\n                <span style=\"width:20px;height:20px;border-radius:5px;border:2px solid {{ autoInvoiceAllBorder }};background:{{ autoInvoiceAllBg }};display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700\">{{ autoInvoiceAllCheck }}<\u002Fspan>\n                <span style=\"font-size:13px;font-weight:700;color:#241812\">เลือกทั้งหมด<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:6px;margin-bottom:18px\">\n                <sc-for list=\"{{ autoInvoiceList }}\" as=\"r\" hint-placeholder-count=\"8\">\n                  <div onclick=\"{{ r.onToggle }}\" style=\"display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;border:1px solid #F0E9DC;cursor:pointer\">\n                    <span style=\"width:20px;height:20px;border-radius:5px;border:2px solid {{ r.boxBorder }};background:{{ r.boxBg }};display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700\">{{ r.check }}<\u002Fspan>\n                    <span style=\"font-size:12.5px;font-weight:600;color:#241812;font-family:'IBM Plex Mono',monospace\">{{ r.id }}<\u002Fspan>\n                    <span style=\"font-size:12.5px;color:#241812;flex:1\">{{ r.tenant }}<\u002Fspan>\n                    <span style=\"font-size:11.5px;color:#7C6E5F;font-family:'IBM Plex Mono',monospace\">{{ r.rentDisplay }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"display:flex;gap:10px\">\n                <div onclick=\"{{ closeAutoInvoice }}\" style=\"flex:1;padding:11px;border-radius:7px;border:1px solid #D8C9B4;color:#7C6E5F;font-size:13px;font-weight:600;cursor:pointer;text-align:center\">ยกเลิก<\u002Fdiv>\n                <div onclick=\"{{ saveAutoInvoice }}\" style=\"flex:1.4;padding:11px;border-radius:7px;background:#C1622D;color:#fff;font-size:13px;font-weight:700;cursor:pointer;text-align:center\">บันทึก ({{ autoInvoiceSelCount }} ห้อง)<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ showDueReminder }}\">\n          <div onclick=\"{{ closeDueReminder }}\" style=\"position:absolute;inset:0;background:rgba(36,24,18,0.45);display:flex;align-items:center;justify-content:center;z-index:215\">\n            <div onclick=\"{{ stop }}\" style=\"background:#FFFFFF;border-radius:12px;padding:24px;width:440px;max-width:92%;box-sizing:border-box;max-height:88%;overflow:auto\">\n              <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:4px\">\n                <span style=\"font-size:18px\">🔔<\u002Fspan>\n                <div style=\"font-size:16px;font-weight:700;color:#241812\">ตั้งค่าเตือนก่อนครบกำหนด<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-size:12px;color:#7C6E5F;margin-bottom:16px\">กำหนดจำนวนวันล่วงหน้า ข้อความ และห้องที่จะแจ้งเตือน<\u002Fdiv>\n\n              <div style=\"font-size:11.5px;color:#7C6E5F;margin-bottom:5px\">แจ้งเตือนล่วงหน้า (วัน)<\u002Fdiv>\n              <input value=\"{{ dueReminderDays }}\" onchange=\"{{ onDueReminderDays }}\" placeholder=\"3\" style=\"width:100%;padding:9px;border-radius:6px;border:1px solid #E3D8C8;font-size:12.5px;box-sizing:border-box;font-family:'IBM Plex Mono',monospace;margin-bottom:14px\">\n\n              <div style=\"font-size:11.5px;color:#7C6E5F;margin-bottom:5px\">ข้อความแจ้งเตือน<\u002Fdiv>\n              <textarea value=\"{{ dueReminderMsg }}\" onchange=\"{{ onDueReminderMsg }}\" placeholder=\"พิมพ์ข้อความแจ้งเตือน...\" style=\"width:100%;min-height:64px;padding:10px;border-radius:6px;border:1px solid #E3D8C8;font-size:12.5px;box-sizing:border-box;resize:vertical;font-family:inherit;margin-bottom:16px\"><\u002Ftextarea>\n\n              <div onclick=\"{{ toggleDueReminderAll }}\" style=\"display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;background:#FBF7F0;cursor:pointer;margin-bottom:8px\">\n                <span style=\"width:20px;height:20px;border-radius:5px;border:2px solid {{ dueReminderAllBorder }};background:{{ dueReminderAllBg }};display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700\">{{ dueReminderAllCheck }}<\u002Fspan>\n                <span style=\"font-size:13px;font-weight:700;color:#241812\">เลือกทั้งหมด<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:6px;margin-bottom:18px\">\n                <sc-for list=\"{{ dueReminderList }}\" as=\"r\" hint-placeholder-count=\"8\">\n                  <div onclick=\"{{ r.onToggle }}\" style=\"display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;border:1px solid #F0E9DC;cursor:pointer\">\n                    <span style=\"width:20px;height:20px;border-radius:5px;border:2px solid {{ r.boxBorder }};background:{{ r.boxBg }};display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700\">{{ r.check }}<\u002Fspan>\n                    <span style=\"font-size:12.5px;font-weight:600;color:#241812;font-family:'IBM Plex Mono',monospace\">{{ r.id }}<\u002Fspan>\n                    <span style=\"font-size:12.5px;color:#241812;flex:1\">{{ r.tenant }}<\u002Fspan>\n                    <span style=\"font-size:11.5px;color:#7C6E5F;font-family:'IBM Plex Mono',monospace\">{{ r.rentDisplay }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"display:flex;gap:10px\">\n                <div onclick=\"{{ closeDueReminder }}\" style=\"flex:1;padding:11px;border-radius:7px;border:1px solid #D8C9B4;color:#7C6E5F;font-size:13px;font-weight:600;cursor:pointer;text-align:center\">ยกเลิก<\u002Fdiv>\n                <div onclick=\"{{ saveDueReminder }}\" style=\"flex:1.4;padding:11px;border-radius:7px;background:#C1622D;color:#fff;font-size:13px;font-weight:700;cursor:pointer;text-align:center\">บันทึก ({{ dueReminderSelCount }} ห้อง)<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ showBroadcast }}\">\n          <div onclick=\"{{ closeBroadcast }}\" style=\"position:absolute;inset:0;background:rgba(36,24,18,0.45);display:flex;align-items:center;justify-content:center;z-index:215\">\n            <div onclick=\"{{ stop }}\" style=\"background:#FFFFFF;border-radius:12px;padding:24px;width:440px;max-width:92%;box-sizing:border-box;max-height:88%;overflow:auto\">\n              <div style=\"position:sticky;top:-24px;z-index:2;background:#FFFFFF;margin:-24px -24px 14px -24px;padding:24px 24px 12px\">\n                <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:4px\">\n                  <span style=\"font-size:19px\">📢<\u002Fspan>\n                  <div style=\"font-size:16px;font-weight:700;color:#241812\">ส่งแจ้งเตือนทาง LINE<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"font-size:12px;color:#7C6E5F\">ติ๊กเลือกผู้รับ แล้วระบบจะส่งข้อความอัตโนมัติทาง LINE<\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"font-size:11.5px;color:#7C6E5F;margin-bottom:5px\">ข้อความ<\u002Fdiv>\n              <textarea value=\"{{ broadcastMsg }}\" onchange=\"{{ onBroadcastMsg }}\" placeholder=\"พิมพ์ข้อความแจ้งเตือน...\" style=\"width:100%;min-height:64px;padding:10px;border-radius:6px;border:1px solid #E3D8C8;font-size:12.5px;box-sizing:border-box;resize:vertical;font-family:inherit;margin-bottom:16px\"><\u002Ftextarea>\n\n              <div onclick=\"{{ toggleBroadcastAll }}\" style=\"display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;background:#FBF7F0;cursor:pointer;margin-bottom:8px\">\n                <span style=\"width:20px;height:20px;border-radius:5px;border:2px solid {{ broadcastAllBoxBorder }};background:{{ broadcastAllBoxBg }};display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700\">{{ broadcastAllCheck }}<\u002Fspan>\n                <span style=\"font-size:13px;font-weight:700;color:#241812\">เลือกทั้งหมด<\u002Fspan>\n              <\u002Fdiv>\n\n              <div onclick=\"{{ toggleBroadcastOwner }}\" style=\"display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;border:1px solid #F0E9DC;cursor:pointer;margin-bottom:10px\">\n                <span style=\"width:20px;height:20px;border-radius:5px;border:2px solid {{ broadcastOwnerBoxBorder }};background:{{ broadcastOwnerBoxBg }};display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700\">{{ broadcastOwnerCheck }}<\u002Fspan>\n                <span style=\"font-size:13px;color:#241812;flex:1\">เจ้าของ / ผู้ดูแล<\u002Fspan>\n                <span style=\"font-size:10px;font-weight:600;color:#06C755\">LINE<\u002Fspan>\n              <\u002Fdiv>\n\n              <div style=\"font-size:11px;font-weight:600;letter-spacing:0.03em;text-transform:uppercase;color:#9C8B78;margin:6px 0 6px\">ผู้เช่ารายห้อง<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:6px;margin-bottom:18px\">\n                <sc-for list=\"{{ broadcastRooms }}\" as=\"b\" hint-placeholder-count=\"8\">\n                  <div onclick=\"{{ b.onToggle }}\" style=\"display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;border:1px solid #F0E9DC;cursor:pointer\">\n                    <span style=\"width:20px;height:20px;border-radius:5px;border:2px solid {{ b.boxBorder }};background:{{ b.boxBg }};display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700\">{{ b.check }}<\u002Fspan>\n                    <span style=\"font-size:12.5px;font-weight:600;color:#241812;font-family:'IBM Plex Mono',monospace\">{{ b.id }}<\u002Fspan>\n                    <span style=\"font-size:12.5px;color:#241812;flex:1\">{{ b.tenant }}<\u002Fspan>\n                    <span style=\"font-size:10px;font-weight:600;color:{{ b.lineColor }}\">{{ b.lineLabel }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n\n              <div style=\"display:flex;gap:10px\">\n                <div onclick=\"{{ closeBroadcast }}\" style=\"flex:1;padding:11px;border-radius:7px;border:1px solid #D8C9B4;color:#7C6E5F;font-size:13px;font-weight:600;cursor:pointer;text-align:center\">ยกเลิก<\u002Fdiv>\n                <div onclick=\"{{ sendBroadcast }}\" style=\"flex:1.4;padding:11px;border-radius:7px;background:#06C755;color:#fff;font-size:13px;font-weight:700;cursor:pointer;text-align:center\">ส่ง ({{ broadcastSelCount }})<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ showMaintDone }}\">\n          <div onclick=\"{{ closeMaintDone }}\" style=\"position:absolute;inset:0;background:rgba(36,24,18,0.45);display:flex;align-items:center;justify-content:center;z-index:210\">\n            <div onclick=\"{{ stop }}\" style=\"background:#FFFFFF;border-radius:12px;padding:24px;width:340px;box-sizing:border-box;text-align:center\">\n              <div style=\"width:52px;height:52px;border-radius:50%;background:#E4EFE7;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:24px\">✓<\u002Fdiv>\n              <div style=\"font-size:16px;font-weight:700;color:#241812;margin-bottom:6px\">ยืนยันงานซ่อมเสร็จสิ้น<\u002Fdiv>\n              <div style=\"font-size:12.5px;color:#9C8B78;margin-bottom:18px;line-height:1.5\">เมื่อยืนยันแล้ว รายการนี้จะถูกนำออกจากรายการแจ้งซ่อม<\u002Fdiv>\n              <div style=\"display:flex;gap:10px\">\n                <div onclick=\"{{ closeMaintDone }}\" style=\"flex:1;padding:1
