<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เช่าสุข — ติดต่อเรา</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'IBM Plex Sans Thai', sans-serif;
    background: #F7F1E6; color: #241812;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .wrap { width: 100%; max-width: 420px; text-align: center; }
  .logo-row { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 24px; }
  .logo-badge { width: 38px; height: 38px; border-radius: 10px; background: #C1622D; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 17px; }
  .logo-text { font-size: 20px; font-weight: 700; }
  .card { background: #FFFFFF; border-radius: 14px; padding: 36px 26px; box-shadow: 0 8px 28px rgba(36,24,18,0.08); }
  .icon { font-size: 40px; margin-bottom: 14px; }
  .title { font-size: 17px; font-weight: 700; margin-bottom: 10px; }
  .desc { font-size: 13px; color: #7C6E5F; line-height: 1.7; margin-bottom: 22px; }
  .back-link { display: inline-block; font-size: 12.5px; font-weight: 600; color: #C1622D; text-decoration: none; padding: 10px 20px; border: 1.5px solid #C1622D; border-radius: 8px; }
  .back-link:hover { background: #FBF0E8; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo-row"><div class="logo-badge">ช</div><div class="logo-text">เช่าสุข</div></div>
    <div class="card">
      <div class="icon">🚧</div>
      <div class="title">การสมัครใช้งานตึกใหม่ยังอยู่ระหว่างพัฒนา</div>
      <div class="desc">
        ตอนนี้ระบบยังไม่เปิดให้สมัครสร้างบัญชี/ตึกใหม่ด้วยตัวเองครับ<br>
        รอการอัปเดทในเร็วๆ นี้ — ระหว่างนี้หากสนใจใช้งาน กรุณาติดต่อทีมงานโดยตรง
      </div>
      <a class="back-link" href="/login">← กลับไปหน้าเข้าสู่ระบบ</a>
    </div>
  </div>
</body>
</html>
