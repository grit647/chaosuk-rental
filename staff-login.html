<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เช่าสุข — เข้าสู่ระบบ (ผู้ดูแล)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'IBM Plex Sans Thai', sans-serif;
    background: #F7F1E6; color: #241812;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .wrap { width: 100%; max-width: 380px; }
  .logo-row { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 6px; }
  .logo-badge { width: 38px; height: 38px; border-radius: 10px; background: #C1622D; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 17px; }
  .logo-text { font-size: 20px; font-weight: 700; }
  .tagline { text-align: center; font-size: 12.5px; color: #9C8B78; margin-bottom: 28px; }
  .card { background: #FFFFFF; border-radius: 14px; padding: 28px 26px; box-shadow: 0 8px 28px rgba(36,24,18,0.08); }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 11.5px; font-weight: 600; color: #7C6E5F; margin-bottom: 5px; }
  .field input { width: 100%; padding: 10px 12px; border-radius: 7px; border: 1px solid #E3D8C8; font-size: 13px; font-family: inherit; }
  .field input:focus { outline: none; border-color: #2C6E8F; }
  .submit-btn { width: 100%; padding: 12px; border-radius: 8px; border: none; background: #2C6E8F; color: #fff; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; }
  .submit-btn:disabled { opacity: 0.6; cursor: default; }
  .err { font-size: 12px; color: #B24336; margin-top: 12px; text-align: center; display: none; }
  .owner-link { text-align: center; margin-top: 16px; font-size: 12px; color: #7C6E5F; }
  .owner-link a { color: #2C6E8F; font-weight: 600; text-decoration: none; }
  .owner-link a:hover { text-decoration: underline; }
  .footer-note { text-align: center; font-size: 10.5px; color: #B0A08C; margin-top: 18px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo-row"><div class="logo-badge">ช</div><div class="logo-text">เช่าสุข</div></div>
    <div class="tagline">เข้าสู่ระบบ — สำหรับผู้ดูแล</div>
    <div class="card">
      <div class="field">
        <label>รหัสตึก</label>
        <input type="text" id="buildingKeyId" placeholder="เช่น OB-001" autocomplete="off">
        <!-- Per explicit user design: staff logs in with a DIFFERENT
             3-field flow from the owner (buildingKeyId + own phone + own
             PIN), a completely separate credential set the owner never
             has to share their own login for. -->
        <div style="font-size:10.5px;color:#9C8B78;margin-top:5px">ขอรหัสตึกนี้จากเจ้าของหอพักครับ</div>
      </div>
      <div class="field">
        <label>เบอร์โทรศัพท์ของท่าน</label>
        <input type="tel" id="phone" placeholder="08X-XXX-XXXX" autocomplete="tel">
      </div>
      <div class="field">
        <label>รหัสผ่านของท่าน</label>
        <input type="password" id="pin" placeholder="รหัสผ่าน" autocomplete="current-password">
      </div>
      <button class="submit-btn" id="submitBtn" onclick="doLogin()">เข้าสู่ระบบ</button>
      <div class="err" id="err"></div>
      <div class="owner-link">เป็นเจ้าของหอพัก? <a href="/login">เข้าสู่ระบบที่นี่</a></div>
      <div class="owner-link">เป็นผู้เช่า/พนักงาน? <a href="/tenant-login">เข้าสู่ระบบที่นี่</a></div>
    </div>
    <div class="footer-note">เช่าสุข — ระบบจัดการหอพัก/อพาร์ทเมนท์</div>
  </div>

<script>
  async function doLogin() {
    const buildingKeyId = document.getElementById('buildingKeyId').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const pin = document.getElementById('pin').value.trim();
    const err = document.getElementById('err');
    const btn = document.getElementById('submitBtn');
    err.style.display = 'none';
    if (!buildingKeyId || !phone || !pin) {
      err.textContent = 'กรุณากรอกรหัสตึก เบอร์โทร และรหัสผ่านให้ครบ';
      err.style.display = 'block';
      return;
    }
    btn.disabled = true;
    btn.textContent = 'กำลังเข้าสู่ระบบ...';
    try {
      const res = await fetch('/api/auth/staff-login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ buildingKeyId, phone, pin }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'เข้าสู่ระบบไม่สำเร็จ');
      // Staff sees the exact same full dashboard as the owner (per
      // explicit user design — this is an accounting-clerk role, not a
      // restricted view), so this goes straight to the main app, not a
      // building picker (staff only ever belongs to the one building
      // they logged into).
      window.location.href = '/';
    } catch (e) {
      err.textContent = e.message;
      err.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'เข้าสู่ระบบ';
    }
  }
  document.getElementById('pin').addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });
</script>
</body>
</html>
