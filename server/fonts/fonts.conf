<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Render's Linux instance has no Thai-capable system font installed, so
  sharp's SVG renderer (librsvg -> pango -> fontconfig) was silently
  falling back to a font with no Thai glyphs, rendering every Thai
  character as a tofu box even though the exact same code worked fine on a
  local Windows dev machine. This file, combined with FONTCONFIG_PATH being
  set to this directory in server/receiptImage.js, points fontconfig at
  our own bundled Noto Sans Thai file instead of relying on whatever (if
  anything) happens to be installed system-wide.

  <dir>.</dir> is relative to THIS file's own location, not the process's
  working directory — so this works unchanged whether run locally or on
  Render, no hardcoded absolute path needed.
-->
<fontconfig>
  <dir>.</dir>
  <cachedir>/tmp/chaosuk-fontconfig-cache</cachedir>
</fontconfig>
