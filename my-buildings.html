<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เช่าสุข — ตึกของคุณ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'IBM Plex Sans Thai', sans-serif;
    background: #F7F1E6; color: #241812;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .wrap { width: 100%; max-width: 420px; }
  .logo-row { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 6px; }
  .logo-badge { width: 38px; height: 38px; border-radius: 10px; background: #C1622D; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 17px; }
  .logo-text { font-size: 20px; font-weight: 700; }
  .tagline { text-align: center; font-size: 12.5px; color: #9C8B78; margin-bottom: 24px; }
  .list { display: flex; flex-direction: column; gap: 12px; }
  .building-card {
    background: #FFFFFF; border-radius: 12px; padding: 18px 20px;
    box-shadow: 0 6px 20px rgba(36,24,18,0.06); cursor: pointer;
    display: flex; align-items: center; gap: 14px;
    border: 1.5px solid transparent; text-decoration: none; color: inherit;
  }
  .building-card:hover { border-color: #C1622D; }
  .building-card.active { border-color: #3B7A52; }
  .building-icon { width: 42px; height: 42px; border-radius: 10px; background: #F1EBE0; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
  .building-name { font-size: 14.5px; font-weight: 700; }
  .building-sub { font-size: 11px; color: #9C8B78; margin-top: 2px; }
  .copy-line-btn {
    display: inline-block; margin-top: 6px; font-size: 10.5px; font-weight: 600;
    color: #2C6E8F; background: #DCEAF2; padding: 3px 8px; border-radius: 5px;
    cursor: pointer;
  }
  .copy-line-btn:hover { background: #C7DFEC; }
  .arrow { margin-left: auto; color: #C1622D; font-size: 16px; }
  .add-building {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 16px; border-radius: 12px; border: 1.5px dashed #D8C9B4;
    color: #7C6E5F; font-size: 13px; font-weight: 600; text-decoration: none;
    margin-top: 4px;
  }
  .add-building:hover { border-color: #C1622D; color: #C1622D; }
  .loading, .err { text-align: center; font-size: 12.5px; color: #9C8B78; padding: 20px; }
  .err { color: #B24336; }
  .footer-links { display: flex; justify-content: center; gap: 18px; margin-top: 20px; font-size: 11.5px; }
  .footer-links a, .footer-links span { color: #9C8B78; text-decoration: underline; cursor: pointer; }
  /* Change-login-PIN modal */
  .modal-overlay { position: fixed; inset: 0; background: rgba(36,24,18,0.45); display: none; align-items: center; justify-content: center; z-index: 50; }
  .modal-overlay.show { display: flex; }
  .modal-card { background: #fff; border-radius: 12px; padding: 24px; width: 340px; max-width: 92vw; box-sizing: border-box; }
  .modal-card .field { margin-bottom: 12px; }
  .modal-card label { display: block; font-size: 11.5px; font-weight: 600; color: #7C6E5F; margin-bottom: 5px; }
  .modal-card input { width: 100%; padding: 9px; border-radius: 6px; border: 1px solid #E3D8C8; font-size: 12.5px; font-family: inherit; box-sizing: border-box; }
  .modal-btn-row { display: flex; gap: 10px; margin-top: 16px; }
  .modal-btn-row button { flex: 1; padding: 10px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .btn-cancel { background: none; border: 1px solid #E3D8C8; color: #241812; }
  .btn-confirm { background: #C1622D; border: none; color: #fff; }
  .modal-err { font-size: 11.5px; color: #B24336; margin-top: 8px; display: none; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo-row"><div class="logo-badge">ช</div><div class="logo-text">เช่าสุข</div></div>
    <div class="tagline">เลือกตึกที่ต้องการจัดการ</div>
    <div id="content" class="loading">กำลังโหลด...</div>
  </div>

  <div class="modal-overlay" id="pinModalOverlay">
    <div class="modal-card">
      <div style="font-size:15px;font-weight:700;margin-bottom:4px">เปลี่ยนรหัสเข้าสู่ระบบ</div>
      <div style="font-size:11px;color:#7C6E5F;margin-bottom:16px">รหัสนี้ใช้ล็อกอินเข้าดูทุกตึกของคุณ (คู่กับเบอร์โทร) — เปลี่ยนแล้วมีผลกับทุกตึกที่คุณดูแล ไม่เกี่ยวกับรหัสความปลอดภัยภายในของแต่ละตึก</div>
      <div class="field"><label>รหัสเดิม</label><input type="password" id="oldPin" autocomplete="off"></div>
      <div class="field"><label>รหัสใหม่ (อย่างน้อย 4 ตัวอักษร)</label><input type="password" id="newPin" autocomplete="off"></div>
      <div class="modal-err" id="pinModalErr"></div>
      <div class="modal-btn-row">
        <button class="btn-cancel" onclick="closePinModal()">ยกเลิก</button>
        <button class="btn-confirm" id="pinModalConfirm" onclick="submitChangeLoginPin()">เปลี่ยนรหัส</button>
      </div>
    </div>
  </div>

<script>
  async function init() {
    const contentEl = document.getElementById('content');
    try {
      const meRes = await fetch('/api/auth/me');
      const me = await meRes.json();
      if (!me || me.role !== 'owner') {
        window.location.href = '/login';
        return;
      }

      const listRes = await fetch('/api/auth/my-buildings');
      if (!listRes.ok) throw new Error('โหลดรายชื่อตึกไม่สำเร็จ');
      const data = await listRes.json();
      // Staged-rollout gate (server/platformVersion.js) — stashed on window
      // (not React-style state, this page has none) so buildAdminCard can
      // read it without threading it through as a param everywhere.
      window._currentPlatformVersion = data.currentPlatformVersion || 0;

      renderContent(data);
    } catch (e) {
      contentEl.className = 'err';
      contentEl.textContent = 'โหลดข้อมูลไม่สำเร็จ ลองรีเฟรชหน้านี้อีกครั้งครับ';
    }
  }

  function buildCard(b) {
    // "ช่วยเอาลิงค์ lineOA ไว้ส่วนนี้ให้หน่อยครับ...ผมขี้เกียจส่งให้ลูกค้า
    // แล้วครับ" (2026-07-26) — ปุ่มคัดลอกลิงก์เพิ่มเพื่อน LINE OA ของตึกนั้น
    // (ตั้งค่าไว้ที่หน้าตั้งค่า > ข้อมูลหอพัก) เฉพาะตึกที่ตั้งไว้แล้วเท่านั้น
    // — ใช้ stopPropagation กันไม่ให้คลิกปุ่มคัดลอกแล้วเด้งเข้าไปจัดการตึก
    // นั้นไปด้วย (การ์ดทั้งใบคลิกได้อยู่แล้ว)
    const lineBtn = b.lineOAShortUrl
      ? '<span class="copy-line-btn" onclick="copyLineLink(event, \'' + b.lineOAShortUrl.replace(/'/g, "\\'") + '\', this)">📋 คัดลอกลิงก์ LINE</span>'
      : '';
    return '<div class="building-card' + (b.isActive ? ' active' : '') + '" onclick="selectBuilding(\'' + b.customerSheetId.replace(/'/g, "\\'") + '\')">' +
        '<div class="building-icon">🏢</div>' +
        '<div style="flex:1;min-width:0"><div class="building-name">' + escapeHtml(b.name) + '</div><div class="building-sub">แตะเพื่อเข้าจัดการ</div>' + lineBtn + '</div>' +
        '<span class="arrow">›</span>' +
      '</div>';
  }

  // คัดลอกลิงก์เพิ่มเพื่อน LINE OA — เปลี่ยนข้อความปุ่มชั่วคราวเป็น
  // "คัดลอกแล้ว!" ให้เห็นชัดว่าสำเร็จ ไม่ต้องมี toast แยก
  function copyLineLink(event, url, el) {
    event.stopPropagation();
    navigator.clipboard.writeText(url).then(() => {
      const original = el.textContent;
      el.textContent = '✅ คัดลอกแล้ว!';
      setTimeout(() => { el.textContent = original; }, 1500);
    }).catch(() => {
      alert('คัดลอกไม่สำเร็จ ลองคัดลอกเองครับ: ' + url);
    });
  }

  // Per explicit user request: platform-admin-only card variant with
  // ลบ/พักการใช้งาน controls — separate from the plain clickable card
  // above (used for the owner's own building list) so those two actions
  // never accidentally show up where a regular customer could see them.
  function buildAdminCard(b) {
    const suspended = b.status === 'suspended';
    const pendingHandoff = b.handoffStatus !== 'ready';
    // Staged-rollout gate (server/platformVersion.js) — this building is
    // behind whatever's currently live on the server. currentPlatformVersion
    // comes from the /my-buildings response (set on window in init()) so
    // this function doesn't need it threaded through as a param.
    const needsUpdate = (b.platformVersion || 0) < (window._currentPlatformVersion || 0);
    const sid = b.customerSheetId.replace(/'/g, "\\'");
    const badges = [
      suspended ? '<span style="font-size:10px;font-weight:700;color:#B24336;background:#F5E1DC;padding:2px 7px;border-radius:4px;margin-left:4px">พักการใช้งาน</span>' : '',
      pendingHandoff ? '<span style="font-size:10px;font-weight:700;color:#9C7A2E;background:#F5EFDC;padding:2px 7px;border-radius:4px;margin-left:4px">🟡 กำลังตั้งค่า</span>' : '<span style="font-size:10px;font-weight:700;color:#3B7A52;background:#E4EFE7;padding:2px 7px;border-radius:4px;margin-left:4px">✅ พร้อมส่งมอบ</span>',
      needsUpdate ? '<span style="font-size:10px;font-weight:700;color:#2C6E8F;background:#DCEAF2;padding:2px 7px;border-radius:4px;margin-left:4px">🆕 มีอัปเดตใหม่</span>' : '',
    ].join('');
    // Per explicit owner request: server-side work can deploy to production
    // without instantly changing what a live customer sees — this building
    // stays on its last-accepted platformVersion until this button is
    // clicked, then it disappears (needsUpdate becomes false on the next
    // render, since the building's version now matches current).
    const updateBtn = needsUpdate
      ? '<span onclick="updateBuildingVersion(\'' + sid + '\')" style="font-size:10px;font-weight:600;padding:4px 8px;border-radius:5px;cursor:pointer;border:1px solid #A9CBDB;color:#2C6E8F;background:#fff;text-align:center">🆕 อัปเดต</span>'
      : '';
    return '<div class="building-card" style="cursor:default;' + (suspended ? 'opacity:0.6' : '') + '">' +
        '<div class="building-icon" onclick="' + (suspended ? '' : "selectBuilding('" + sid + "')") + '" style="cursor:' + (suspended ? 'default' : 'pointer') + '">🏢</div>' +
        '<div style="flex:1;min-width:0" onclick="' + (suspended ? '' : "selectBuilding('" + sid + "')") + '" style="cursor:' + (suspended ? 'default' : 'pointer') + '">' +
          '<div class="building-name">' + escapeHtml(b.name) + badges + '</div>' +
          '<div class="building-sub">' + (suspended ? 'ถูกพักการใช้งาน — แตะ "เปิดใช้งาน" เพื่อเข้าอีกครั้ง' : 'แตะรูปตึก/ชื่อ เพื่อเข้าจัดการ') + '</div>' +
        '</div>' +
        '<div style="display:flex;flex-direction:column;gap:4px;flex-shrink:0">' +
          updateBtn +
          '<span onclick="toggleHandoffStatus(\'' + sid + '\')" style="font-size:10px;font-weight:600;padding:4px 8px;border-radius:5px;cursor:pointer;border:1px solid #D8C9B4;color:#7C6E5F;background:#fff;text-align:center">' + (pendingHandoff ? '✅ พร้อมส่งมอบแล้ว' : '↩ ยังไม่พร้อม') + '</span>' +
          '<span onclick="toggleBuildingStatus(\'' + sid + '\')" style="font-size:10px;font-weight:600;padding:4px 8px;border-radius:5px;cursor:pointer;border:1px solid #D8C9B4;color:#7C6E5F;background:#fff;text-align:center">' + (suspended ? '▶ เปิดใช้งาน' : '⏸ พัก') + '</span>' +
          '<span onclick="deleteBuilding(\'' + sid + '\')" style="font-size:10px;font-weight:600;padding:4px 8px;border-radius:5px;cursor:pointer;border:1px solid #E3B7AC;color:#B24336;background:#fff;text-align:center">🗑 ลบ</span>' +
        '</div>' +
      '</div>';
  }

  function renderContent(myBuildings) {
    const contentEl = document.getElementById('content');
    contentEl.className = '';
    const cards = (myBuildings.buildings || []).map(buildCard).join('');
    let html = '<div class="list">' + cards +
        '<a class="add-building" href="/contact-us">＋ เพิ่มตึกใหม่ / เพิ่มโครงการใหม่</a>' +
      '</div>';

    // Per explicit user request: platform-admin-only section — lets
    // คุณต้น jump into ANY building (e.g. a brand-new one right after
    // "+ เพิ่มตึกใหม่") to configure it before handing the real login
    // over to that customer. Only ever present in the response for the
    // platform's own account — never sent to a regular customer.
    if (Array.isArray(myBuildings.allBuildings)) {
      const otherCards = myBuildings.allBuildings
        .filter((b) => !(myBuildings.buildings || []).some((m) => m.customerSheetId === b.customerSheetId))
        .map(buildAdminCard).join('');
      html += '<div style="font-size:10.5px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:#B85B27;margin:22px 0 10px">🔧 ทุกตึกในระบบ (Server only)</div>' +
        '<div class="list">' + (otherCards || '<div class="loading" style="padding:10px 0">ยังไม่มีตึกอื่นในระบบ</div>') + '</div>';
    }

    html += '<div class="footer-links"><span onclick="openPinModal()">เปลี่ยนรหัสเข้าสู่ระบบ</span><a href="/api/auth/logout-link">ออกจากระบบ</a></div>';
    contentEl.innerHTML = html;
  }

  async function selectBuilding(customerSheetId) {
    try {
      const res = await fetch('/api/auth/select-building', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ customerSheetId }),
      });
      if (!res.ok) throw new Error();
      window.location.href = '/';
    } catch (e) {
      alert('เข้าตึกนี้ไม่สำเร็จ ลองใหม่อีกครั้งครับ');
    }
  }

  // Per explicit user request: pause/reactivate a building (e.g. a
  // monthly-subscription customer who hasn't paid) without deleting
  // anything — its data stays completely intact, only login access to
  // that specific building is blocked while suspended.
  async function toggleBuildingStatus(customerSheetId) {
    try {
      const res = await fetch('/api/settings/toggle-building-status', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ customerSheetId }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'เปลี่ยนสถานะไม่สำเร็จ');
      init();
    } catch (e) {
      alert(e.message || 'เปลี่ยนสถานะไม่สำเร็จ');
    }
  }

  // Per explicit user request: a "พร้อมส่งมอบแล้ว" checklist marker —
  // purely informational (doesn't block login, unlike ⏸ พัก above) so
  // คุณต้น doesn't lose track of which new buildings still need setup.
  async function toggleHandoffStatus(customerSheetId) {
    try {
      const res = await fetch('/api/settings/toggle-handoff-status', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ customerSheetId }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'เปลี่ยนสถานะไม่สำเร็จ');
      init();
    } catch (e) {
      alert(e.message || 'เปลี่ยนสถานะไม่สำเร็จ');
    }
  }

  // Per explicit owner request (staged-rollout gate, server/
  // platformVersion.js): bumps this ONE building to whatever's currently
  // live on the server — server-side work can deploy without instantly
  // changing what any live customer sees, until this button is clicked
  // for them specifically. One-way forward only, no "revert" button.
  async function updateBuildingVersion(customerSheetId) {
    try {
      const res = await fetch('/api/settings/update-building-version', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ customerSheetId }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'อัปเดตไม่สำเร็จ');
      init();
    } catch (e) {
      alert(e.message || 'อัปเดตไม่สำเร็จ');
    }
  }

  // Per explicit user request: removes the LOGIN ROW only — the
  // building's Google Sheet and everything in it stay completely
  // untouched, this just revokes the ability to log into it.
  // Per explicit user request: also moves the actual Google Sheet to
  // Trash (recoverable ~30 days from Google Drive, NOT permanent) —
  // deliberately not a hard delete, so a misclick can still be undone.
  async function deleteBuilding(customerSheetId) {
    // Real limitation found: the service account only has Editor access
    // to each customer's Sheet (whoever created it stays the actual
    // owner) — Google Drive requires FILE OWNERSHIP to trash a file via
    // the API, so this step can fail depending on how the Sheet was
    // shared. Confirmation text below sets that expectation up front
    // instead of promising something that isn't always possible.
    if (!confirm('ลบตึกนี้? จะเกิดขึ้นทันที:\n1. ลบสิทธิ์ login ออกจากสมุดรายชื่อกลาง (แน่นอน)\n\nระบบจะพยายามย้าย Google Sheet ไปถังขยะให้ด้วย แต่อาจทำไม่ได้ถ้า service account ไม่ใช่เจ้าของไฟล์ (กรณีนี้ต้องไปลบเอง)')) return;
    try {
      const res = await fetch('/api/settings/delete-building', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ customerSheetId }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'ลบไม่สำเร็จ');
      if (data.sheetTrashed) {
        alert('ลบสำเร็จ — ย้าย Google Sheet ไปถังขยะแล้ว (กู้คืนได้ใน Google Drive ภายใน ~30 วัน)');
      } else {
        alert('ลบสิทธิ์ login สำเร็จแล้ว แต่ย้าย Google Sheet ไปถังขยะไม่สำเร็จ (' + (data.trashError || 'ไม่ทราบสาเหตุ') + ') — รบกวนลบ Sheet เองใน Google Drive ถ้าต้องการ');
      }
      init();
    } catch (e) {
      alert(e.message || 'ลบไม่สำเร็จ');
    }
  }

  function openPinModal() {
    document.getElementById('oldPin').value = '';
    document.getElementById('newPin').value = '';
    document.getElementById('pinModalErr').style.display = 'none';
    document.getElementById('pinModalOverlay').classList.add('show');
  }
  function closePinModal() {
    document.getElementById('pinModalOverlay').classList.remove('show');
  }
  async function submitChangeLoginPin() {
    const oldPin = document.getElementById('oldPin').value.trim();
    const newPin = document.getElementById('newPin').value.trim();
    const errEl = document.getElementById('pinModalErr');
    const btn = document.getElementById('pinModalConfirm');
    errEl.style.display = 'none';
    if (!oldPin || !newPin) {
      errEl.textContent = 'กรุณากรอกรหัสเดิมและรหัสใหม่';
      errEl.style.display = 'block';
      return;
    }
    btn.disabled = true;
    try {
      const res = await fetch('/api/auth/change-login-pin', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ oldPin, newPin }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'เปลี่ยนรหัสไม่สำเร็จ');
      closePinModal();
      alert('เปลี่ยนรหัสเข้าสู่ระบบแล้ว (มีผลกับ ' + data.buildingsUpdated + ' ตึก) — ใช้รหัสใหม่ตอนล็อกอินครั้งถัดไปนะครับ');
    } catch (e) {
      errEl.textContent = e.message;
      errEl.style.display = 'block';
    } finally {
      btn.disabled = false;
    }
  }

  function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }
  init();
</script>
</body>
</html>
