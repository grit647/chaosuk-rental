<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เช่าสุข — พอร์ทัลผู้เช่า</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'IBM Plex Sans Thai', sans-serif; background: #F7F1E6; color: #241812; min-height: 100vh; }
  .topbar { background: #3B7A52; color: #fff; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; }
  .topbar .brand { font-size: 15px; font-weight: 700; }
  .topbar .logout { font-size: 12px; color: #fff; opacity: 0.85; cursor: pointer; text-decoration: underline; background: none; border: none; font-family: inherit; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 20px 16px 60px; }
  .card { background: #FFFFFF; border-radius: 10px; padding: 18px; margin-bottom: 14px; }
  .card-title { font-size: 13px; font-weight: 700; color: #7C6E5F; text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 12px; }
  .room-header { font-size: 20px; font-weight: 700; margin-bottom: 2px; }
  .room-sub { font-size: 12.5px; color: #7C6E5F; }
  .due-amount { font-family: 'IBM Plex Mono', monospace; font-size: 28px; font-weight: 700; color: #C1622D; margin: 6px 0; }
  .due-label { font-size: 12px; color: #7C6E5F; }
  .badge { display: inline-block; font-size: 10.5px; font-weight: 600; padding: 3px 9px; border-radius: 5px; margin-top: 6px; }
  .badge-overdue { background: #F6DCD8; color: #B24336; }
  .badge-pending { background: #F5EFE2; color: #9C7A2E; }
  .badge-none { background: #E4EFE7; color: #3B7A52; }
  .row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #F0E9DC; font-size: 12.5px; }
  .row:last-child { border-bottom: none; }
  .row .label { color: #7C6E5F; }
  .row .value { font-weight: 600; font-family: 'IBM Plex Mono', monospace; }
  .history-item { padding: 10px 0; border-bottom: 1px solid #F0E9DC; }
  .history-item:last-child { border-bottom: none; }
  .history-top { display: flex; justify-content: space-between; font-size: 12.5px; margin-bottom: 3px; }
  .history-amount { font-weight: 700; font-family: 'IBM Plex Mono', monospace; }
  .history-sub { font-size: 11px; color: #9C8B78; }
  textarea { width: 100%; min-height: 70px; padding: 10px; border-radius: 7px; border: 1px solid #E3D8C8; font-size: 13px; font-family: inherit; resize: vertical; box-sizing: border-box; }
  .submit-btn { width: 100%; margin-top: 10px; padding: 11px; border-radius: 7px; border: none; background: #3B7A52; color: #fff; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; }
  .submit-btn:disabled { opacity: 0.6; cursor: default; }
  .empty-note { font-size: 12px; color: #9C8B78; text-align: center; padding: 12px 0; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #241812; color: #fff; padding: 10px 18px; border-radius: 8px; font-size: 12.5px; display: none; z-index: 100; max-width: 90vw; text-align: center; }
  .contract-btn { flex-shrink: 0; background: none; border: 1px solid #D8C9B4; color: #7C6E5F; border-radius: 7px; padding: 8px 12px; font-size: 11.5px; font-weight: 600; cursor: pointer; font-family: inherit; white-space: nowrap; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(36,24,18,0.45); display: none; align-items: center; justify-content: center; z-index: 200; padding: 16px; box-sizing: border-box; }
  .modal-overlay.open { display: flex; }
  .modal-box { background: #FFFFFF; border-radius: 12px; padding: 22px; width: 380px; max-width: 100%; max-height: 85vh; overflow-y: auto; box-sizing: border-box; }
  .modal-title { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
  .modal-sub { font-size: 11.5px; color: #7C6E5F; margin-bottom: 14px; }
  .modal-close-btn { width: 100%; margin-top: 16px; padding: 10px; border-radius: 7px; border: 1px solid #E3D8C8; background: none; color: #241812; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .credit-card { background: #FFFFFF; border-radius: 10px; padding: 14px 18px; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #E3D2A8; }
  .credit-label { font-size: 11.5px; color: #9C7A2E; font-weight: 600; }
  .credit-amount { font-family: 'IBM Plex Mono', monospace; font-size: 18px; font-weight: 700; color: #9C7A2E; }
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand">🏠 เช่าสุข — ผู้เช่า</div>
    <button class="logout" onclick="doLogout()">ออกจากระบบ</button>
  </div>
  <div class="wrap" id="app">
    <div class="card"><div class="empty-note">กำลังโหลดข้อมูล...</div></div>
  </div>
  <div class="toast" id="toast"></div>
  <!-- Per explicit user request: view-only lease contract summary — a
       tenant can look but not edit anything here (no inputs at all, just
       a close button). Sourced entirely from the same GET /api/tenant/me
       response already loaded for the room header, no extra request. -->
  <div class="modal-overlay" id="contractModal" onclick="if (event.target === this) closeContractModal()">
    <div class="modal-box">
      <div class="modal-title">สัญญาเช่า</div>
      <div class="modal-sub">ห้อง <span id="cRoom"></span> — ดูอย่างเดียว ติดต่อเจ้าของหอพักหากต้องการแก้ไข</div>
      <div class="row"><span class="label">ผู้เช่า</span><span class="value" id="cTenant"></span></div>
      <div class="row"><span class="label">เบอร์โทร</span><span class="value" id="cPhone"></span></div>
      <div class="row"><span class="label">ค่าเช่า/เดือน</span><span class="value" id="cRent"></span></div>
      <div class="row"><span class="label">เงินประกัน</span><span class="value" id="cDeposit"></span></div>
      <div class="row"><span class="label">วันที่เข้าอยู่</span><span class="value" id="cMoveIn"></span></div>
      <div class="row"><span class="label">วันหมดอายุสัญญา</span><span class="value" id="cEnd"></span></div>
      <div class="row"><span class="label">ครบกำหนดชำระทุกวันที่</span><span class="value" id="cDue"></span></div>
      <button class="modal-close-btn" onclick="closeContractModal()">ปิด</button>
    </div>
  </div>

<script>
  let roomData = null;
  let invoiceData = [];
  let usageData = null;

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.display = 'block';
    setTimeout(() => { t.style.display = 'none'; }, 3500);
  }

  function fmt(n) {
    return Number(n || 0).toLocaleString('th-TH');
  }

  async function doLogout() {
    await fetch('/api/auth/logout', { method: 'POST' }).catch(() => {});
    window.location.href = '/tenant-login';
  }

  async function loadAll() {
    try {
      const [meRes, invRes] = await Promise.all([
        fetch('/api/tenant/me'),
        fetch('/api/tenant/invoices'),
      ]);
      if (!meRes.ok || !invRes.ok) {
        // Session invalid/expired — bounce back to login.
        window.location.href = '/tenant-login';
        return;
      }
      roomData = await meRes.json();
      invoiceData = await invRes.json();
      // Per explicit user request: show live water/elec usage on the
      // tenant's own portal too, matching what the owner already sees on
      // the ผู้เช่า page's tenant card — but only if this room actually
      // has a Tuya device linked. Fetched separately (not Promise.all'd
      // with the two above) and failure here is non-fatal — a device
      // read hiccup shouldn't block the bill/history view the tenant
      // came here for in the first place.
      try {
        const usageRes = await fetch('/api/tenant/usage');
        usageData = usageRes.ok ? await usageRes.json() : null;
      } catch (e) { usageData = null; }
      render();
    } catch (e) {
      document.getElementById('app').innerHTML = '<div class="card"><div class="empty-note">โหลดข้อมูลไม่สำเร็จ ลองรีเฟรชหน้าอีกครั้งครับ</div></div>';
    }
  }

  function render() {
    const app = document.getElementById('app');
    const current = invoiceData.find((i) => i.status !== 'paid');
    // Per explicit user request: cap ประวัติบิล to the 4 most recent paid
    // bills (roughly the last 4 months, since billing is monthly) — not
    // every paid bill ever, which would grow unbounded over a long lease.
    // invoiceData already arrives newest-first (see server/routes/
    // tenant.js's GET /invoices sort), so .slice(0, 4) here is exactly
    // "the last up-to-4 months that actually have recorded data" — fewer
    // than 4 just shows however many exist, nothing padded/forced.
    const history = invoiceData.filter((i) => i.status === 'paid').slice(0, 4);

    let currentHtml;
    if (current) {
      const total = Number(current.rent || 0) + Number(current.water || 0) + Number(current.elec || 0) + Number(current.trash || 0) + Number(current.internet || 0);
      const remaining = current.remainingDue != null ? current.remainingDue : Math.max(0, total - Number(current.amountPaid || 0));
      const badgeClass = current.status === 'overdue' ? 'badge-overdue' : 'badge-pending';
      const badgeLabel = current.status === 'overdue' ? '⚠️ เกินกำหนดชำระ' : '⏳ รอชำระ';
      currentHtml = '<div class="card">' +
        '<div class="card-title">ยอดที่ต้องชำระ</div>' +
        '<div class="due-amount">฿' + fmt(remaining) + '</div>' +
        '<div class="due-label">ครบกำหนด: ' + (current.due || '-') + '</div>' +
        '<div class="badge ' + badgeClass + '">' + badgeLabel + '</div>' +
        '<div style="margin-top:14px">' +
          rowHtml('ค่าเช่า', current.rent) +
          rowHtml('ค่าน้ำ' + (current.waterUnits != null ? ' (' + current.waterUnits + ' หน่วย)' : ''), current.water) +
          rowHtml('ค่าไฟ' + (current.elecUnits != null ? ' (' + current.elecUnits + ' หน่วย)' : ''), current.elec) +
          (current.trash ? rowHtml('ค่าขยะ', current.trash) : '') +
          (current.internet ? rowHtml('ค่าอินเทอร์เน็ต', current.internet) : '') +
        '</div>' +
      '</div>';
    } else {
      currentHtml = '<div class="card">' +
        '<div class="card-title">ยอดที่ต้องชำระ</div>' +
        '<div class="badge badge-none">✅ ไม่มีบิลค้างชำระ</div>' +
      '</div>';
    }

    const historyHtml = history.length
      ? history.map((i) => {
          const total = Number(i.rent || 0) + Number(i.water || 0) + Number(i.elec || 0) + Number(i.trash || 0) + Number(i.internet || 0);
          return '<div class="history-item">' +
            '<div class="history-top"><span>' + (i.due || i.id) + '</span><span class="history-amount">฿' + fmt(total) + '</span></div>' +
            '<div class="history-sub">น้ำ ' + (i.waterUnits != null ? i.waterUnits : '-') + ' หน่วย · ไฟ ' + (i.elecUnits != null ? i.elecUnits : '-') + ' หน่วย · จ่ายแล้ว</div>' +
          '</div>';
        }).join('')
      : '<div class="empty-note">ยังไม่มีประวัติบิล</div>';

    app.innerHTML =
      '<div class="card">' +
        '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px">' +
          '<div>' +
            '<div class="room-header">ห้อง ' + (roomData.id || '-') + '</div>' +
            '<div class="room-sub">' + (roomData.tenant || '') + '</div>' +
            '<div class="room-sub" style="margin-top:4px">วันหมดอายุสัญญา: ' + (roomData.contractEnd || '-') + '</div>' +
          '</div>' +
          '<button class="contract-btn" onclick="openContractModal()">📄 ดูสัญญาเช่า</button>' +
        '</div>' +
      '</div>' +
      creditHtml() +
      usageHtml() +
      currentHtml +
      '<div class="card">' +
        '<div class="card-title">ประวัติบิล (การใช้น้ำ/ไฟ) — ย้อนหลัง 4 เดือนล่าสุด</div>' +
        historyHtml +
      '</div>' +
      '<div class="card">' +
        '<div class="card-title">แจ้งซ่อม</div>' +
        '<textarea id="maintIssue" placeholder="อธิบายปัญหาที่พบ เช่น แอร์ไม่เย็น ก๊อกน้ำรั่ว"></textarea>' +
        '<button class="submit-btn" id="maintSubmitBtn" onclick="submitMaintenance()">ส่งคำขอแจ้งซ่อม</button>' +
      '</div>';
  }

  function rowHtml(label, value) {
    return '<div class="row"><span class="label">' + label + '</span><span class="value">฿' + fmt(value) + '</span></div>';
  }

  // Per explicit user request: view-only — populates from the same
  // roomData already loaded, no editing UI/handlers at all.
  function openContractModal() {
    if (!roomData) return;
    document.getElementById('cRoom').textContent = roomData.id || '-';
    document.getElementById('cTenant').textContent = roomData.tenant || '-';
    document.getElementById('cPhone').textContent = roomData.phone || '-';
    document.getElementById('cRent').textContent = '฿' + fmt(roomData.rent);
    document.getElementById('cDeposit').textContent = '฿' + fmt(roomData.deposit);
    document.getElementById('cMoveIn').textContent = roomData.moveIn || '-';
    document.getElementById('cEnd').textContent = roomData.contractEnd || '-';
    document.getElementById('cDue').textContent = roomData.dueDay ? ('วันที่ ' + roomData.dueDay) : '-';
    document.getElementById('contractModal').classList.add('open');
  }
  function closeContractModal() {
    document.getElementById('contractModal').classList.remove('open');
  }

  // Per explicit user request: a tenant who paid in advance (e.g. an
  // over-payment or a slip resolved as "credit" — see server-side
  // slipPending/resolveSlip flow) should be able to see their own
  // remaining credit balance, matching what the owner already sees on
  // the ผู้เช่า page's tenant card (selectedTenant.hasCredit/creditDisplay
  // in Rental Management.dc.html) — this was a real gap, roomData.
  // creditBalance was already being sent by GET /api/tenant/me but never
  // rendered anywhere on this page. Renders nothing at all when there's
  // no credit (0 or unset), not an empty/confusing card.
  function creditHtml() {
    if (!roomData || !(Number(roomData.creditBalance) > 0)) return '';
    return '<div class="credit-card">' +
      '<div class="credit-label">💰 ยอดเงินล่วงหน้าคงเหลือ</div>' +
      '<div class="credit-amount">฿' + fmt(roomData.creditBalance) + '</div>' +
    '</div>';
  }

  // Per explicit user request: same live V/A/W/kWh readout + this-cycle
  // usage the owner sees on the ผู้เช่า page's tenant card, shown here
  // too — only rendered if this room actually has a Tuya device linked
  // (hasElecDevice/hasWaterDevice from GET /api/tenant/usage). Returns
  // an empty string (no card at all) if neither is linked, rather than
  // showing an empty/confusing card to every tenant regardless.
  function usageHtml() {
    if (!usageData || (!usageData.hasElecDevice && !usageData.hasWaterDevice)) return '';
    let rows = '';
    if (usageData.hasElecDevice) {
      const live = usageData.elecLive || {};
      if (live.online && live.voltage != null) {
        rows += '<div class="row"><span class="label">⚡ ไฟฟ้าตอนนี้</span><span class="value">' +
          Number(live.voltage).toFixed(1) + 'V · ' + Number(live.current).toFixed(2) + 'A · ' + Number(live.power).toFixed(1) + 'W</span></div>';
      } else {
        rows += '<div class="row"><span class="label">⚡ อุปกรณ์ไฟฟ้า</span><span class="value" style="color:#B24336">ออฟไลน์</span></div>';
      }
      if (usageData.elecUsage != null) {
        rows += '<div class="row"><span class="label">ไฟที่ใช้รอบนี้</span><span class="value">' + usageData.elecUsage + ' หน่วย (฿' + fmt(usageData.elecCost) + ')</span></div>';
      }
    }
    if (usageData.hasWaterDevice) {
      const live = usageData.waterLive || {};
      // Per explicit user request: battery % isn't something a tenant
      // needs to see/act on (it's an owner/maintenance concern — replacing
      // the flowmeter's battery isn't the tenant's job) — only show the
      // ออฟไลน์ warning if relevant, never the battery level itself.
      if (!live.online) {
        rows += '<div class="row"><span class="label">💧 อุปกรณ์น้ำ</span><span class="value" style="color:#B24336">ออฟไลน์</span></div>';
      }
      if (usageData.waterUsage != null) {
        rows += '<div class="row"><span class="label">น้ำที่ใช้รอบนี้</span><span class="value">' + usageData.waterUsage + ' หน่วย (฿' + fmt(usageData.waterCost) + ')</span></div>';
      }
    }
    return '<div class="card">' +
      '<div class="card-title">การใช้น้ำ/ไฟตอนนี้ (นับจากบิลล่าสุด)</div>' +
      rows +
    '</div>';
  }

  async function submitMaintenance() {
    const textarea = document.getElementById('maintIssue');
    const btn = document.getElementById('maintSubmitBtn');
    const issue = textarea.value.trim();
    if (!issue) { showToast('กรุณากรอกรายละเอียดปัญหาก่อนครับ'); return; }
    btn.disabled = true;
    btn.textContent = 'กำลังส่ง...';
    try {
      const res = await fetch('/api/tenant/maintenance', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ issue }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'ส่งไม่สำเร็จ');
      textarea.value = '';
      showToast(data.message || 'ส่งคำขอแจ้งซ่อมแล้วครับ');
    } catch (e) {
      showToast(e.message || 'ส่งไม่สำเร็จ');
    } finally {
      btn.disabled = false;
      btn.textContent = 'ส่งคำขอแจ้งซ่อม';
    }
  }

  loadAll();
</script>
</body>
</html>
